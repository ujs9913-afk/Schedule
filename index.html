            </div>
            <div class="divide-y">${weeksHtml}</div>
        </div>
    </div>`;
}

/**
 * [핵심 요구사항 1 반영] 주간 근무표의 1주차~5/6주차 버튼을 가로 스크롤 없이 모두 한눈에 클릭할 수 있도록 3열 그리드(grid-cols-3)로 배치!
 */
function renderWeekDetailList(year, month, weeks, overUserMap) {
    const isAdmin = isViewingAsAdmin();
    const filterMy = !isAdmin && state.scheduleFilter === 'my';
    const myId = state.currentUser.id;
    const activeSchedules = getActiveSchedules();
    const currentWeek = weeks[state.currentWeekIndex] || weeks[0];
    const dayLabels = ['일', '월', '화', '수', '목', '금', '토'];

    // 스크롤 없이 모든 주차를 바로 터치/클릭할 수 있는 반응형 그리드 탭
    let tabsHtml = weeks.map((w, idx) => {
        const f = w[0], l = w[6];
        const active = idx === state.currentWeekIndex;
        return `
        <button type="button" onclick="setWeekIndex(${idx})" class="py-2 px-2 rounded-2xl text-xs font-bold border transition flex flex-col items-center justify-center ${active ? 'bg-indigo-600 text-white border-indigo-600 shadow-md ring-2 ring-indigo-200' : 'bg-white text-slate-700 border-slate-200 hover:bg-slate-50'}">
            <span>${idx + 1}주차</span>
            <span class="text-[10px] font-medium ${active ? 'text-indigo-100' : 'text-slate-400'}">${f.month}/${f.day}~${l.month}/${l.day}</span>
        </button>`;
    }).join('');

    const q = (state.weekSearchQuery || '').trim().toLowerCase();
    let targetUsers = filterMy ? db.users.filter(u => u.id === myId) : db.users;
    if (q) {
        targetUsers = targetUsers.filter(u => u.name.toLowerCase().includes(q) || (u.role && u.role.toLowerCase().includes(q)));
    }

    let tbodyHtml = targetUsers.map(u => {
        let weekTotalWork = 0;
        let weekTotalOt = 0;

        const dayCellsHtml = currentWeek.map((cell) => {
            const { dateStr, isCurrentMonth } = cell;
            const daySched = activeSchedules[dateStr] || {};
            const isHol = isWeekendOrHoliday(dateStr);

            const dailyWork = getUserDailyTotalWorkHours(dateStr, u.id, isAdmin);
            const dailyOt = getUserDailyOt(dateStr, u.id, isAdmin);
            weekTotalWork += dailyWork;
            weekTotalOt += dailyOt;

            const cellBgCls = !isCurrentMonth ? 'bg-slate-50/70' : (isHol ? 'bg-rose-50/15' : '');

            const myLeave = db.leaveRequests.find(lr => lr.date === dateStr && lr.userId === u.id && lr.status === 'approved');
            if (myLeave) {
                return `<td onclick="openDayScheduleModal('${dateStr}')" class="p-1 border-r border-slate-100 text-center cursor-pointer ${cellBgCls} hover:bg-rose-50/40">
                    <span class="inline-block px-1.5 py-0.5 rounded bg-rose-100 text-rose-700 font-bold text-[10px] whitespace-nowrap">🌴${myLeave.type}</span>
                </td>`;
            }

            let assignedShift = null;
            for (const s of db.shifts) {
                if ((daySched[s.id] || []).includes(u.id)) {
                    assignedShift = s;
                    break;
                }
            }

            if (assignedShift) {
                const c = getShiftColor(assignedShift.colorId);
                return `<td onclick="openDayScheduleModal('${dateStr}')" class="p-1 border-r border-slate-100 text-center cursor-pointer ${cellBgCls} hover:bg-indigo-50/40">
                    <div style="background:${c.bg}; color:${c.text}; border:1px solid ${c.border}" class="px-1 py-0.5 rounded font-bold text-[10px] leading-tight whitespace-nowrap ${!isCurrentMonth ? 'opacity-85' : ''}">
                        ${assignedShift.name}
                    </div>
                    ${dailyOt > 0 ? `<div class="text-[8px] font-extrabold text-sky-600 mt-0.5">+${dailyOt}h</div>` : ''}
                </td>`;
            }

            if (isHol && isUserHolidayUnavailable(u.id, dateStr)) {
                return `<td onclick="openDayScheduleModal('${dateStr}')" class="p-1 border-r border-slate-100 text-center cursor-pointer ${cellBgCls}">
                    <span class="inline-block px-1 py-0.5 rounded bg-slate-200 text-slate-600 font-bold text-[9px] whitespace-nowrap">🚫불가</span>
                </td>`;
            }

            return `<td onclick="openDayScheduleModal('${dateStr}')" class="p-1 border-r border-slate-100 text-center cursor-pointer ${cellBgCls} hover:bg-slate-100/60">
                <span class="text-[10px] text-slate-300">-</span>
            </td>`;
        }).join('');

        weekTotalWork = round1(weekTotalWork);
        weekTotalOt = round1(weekTotalOt);
        const isOver52 = weekTotalWork >= MAX_WEEKLY_WORK_HOURS;

        return `
        <tr class="border-b border-slate-100 ${isOver52 ? 'bg-rose-50/40' : 'hover:bg-slate-50/80'}">
            <td class="sticky left-0 z-10 ${isOver52 ? 'bg-rose-50' : 'bg-white'} py-2 px-2.5 border-r border-slate-200 sticky-col-shadow whitespace-nowrap">
                <div class="font-bold text-xs text-slate-800 flex items-center gap-1">
                    <span>${u.name}</span>
                    ${isOver52 ? '<span class="text-[9px] text-rose-600 font-extrabold">🚨</span>' : ''}
                </div>
                <div class="text-[9px] text-slate-400">${u.role}</div>
            </td>
            ${dayCellsHtml}
            <td class="py-2 px-2 text-center border-r border-slate-100 whitespace-nowrap ${isOver52 ? 'bg-rose-100/80 text-rose-700 font-extrabold' : 'bg-slate-50/70 text-slate-800 font-bold'} text-xs">
                ${weekTotalWork}h
            </td>
            <td class="py-2 px-2 text-center whitespace-nowrap bg-sky-50/50 font-extrabold ${weekTotalOt > 0 ? 'text-sky-700' : 'text-slate-300'} text-xs">
                ${weekTotalOt > 0 ? `+${weekTotalOt}h` : '0h'}
            </td>
        </tr>`;
    }).join('');

    return `
    <div class="space-y-3">
        <!-- 가로 스크롤 없이 모든 주차를 바로 누를 수 있는 3열 그리드 버튼 -->
        <div class="grid grid-cols-3 gap-1.5">${tabsHtml}</div>

        ${!filterMy ? `
        <div class="bg-white rounded-2xl px-3 py-2 border border-slate-200 flex items-center gap-2 shadow-sm">
            <i class="fa-solid fa-magnifying-glass text-slate-400 text-xs"></i>
            <input type="text" value="${state.weekSearchQuery}" oninput="updateWeekSearch(this.value)" placeholder="직원 이름 또는 직급 검색 (총 ${db.users.length}명)..." class="flex-1 text-xs text-slate-800 focus:outline-none">
            ${state.weekSearchQuery ? `<button onclick="updateWeekSearch('')" class="text-xs text-slate-400 hover:text-slate-600"><i class="fa-solid fa-circle-xmark"></i></button>` : ''}
        </div>
        ` : ''}

        <!-- 주간 매트릭스 테이블 -->
        <div class="bg-white rounded-3xl border border-slate-200 shadow-sm overflow-hidden">
            <div class="overflow-x-auto max-h-[65vh]">
                <table class="w-full border-collapse text-xs">
                    <thead class="sticky top-0 z-20 bg-slate-100 border-b border-slate-200 text-[10px] text-slate-600">
                        <tr>
                            <th class="sticky left-0 z-30 bg-slate-100 py-2.5 px-2.5 text-left font-extrabold border-r border-slate-200 sticky-col-shadow min-w-[76px]">
                                이름 (${targetUsers.length}명)
                            </th>
                            ${currentWeek.map((cell, dIdx) => {
                                const { dateStr, isCurrentMonth } = cell;
                                const isCustomHol = (db.holidays || []).includes(dateStr);
                                const colorCls = (dIdx === 0 || isCustomHol) ? 'text-rose-600 font-extrabold' : (dIdx === 6 ? 'text-blue-600 font-extrabold' : 'text-slate-700 font-bold');
                                return `<th onclick="openDayScheduleModal('${dateStr}')" class="py-2 px-1.5 text-center border-r border-slate-200 min-w-[52px] cursor-pointer hover:bg-slate-200/70 ${!isCurrentMonth ? 'bg-slate-200/50 opacity-80' : ''} ${colorCls}">
                                    <div>${cell.month}/${cell.day}</div>
                                    <div class="text-[9px]">(${dayLabels[dIdx]})${!isCurrentMonth ? '·전달' : ''}</div>
                                </th>`;
                            }).join('')}
                            <th class="py-2 px-2 text-center font-extrabold text-slate-800 bg-slate-200/70 border-r border-slate-200 min-w-[56px]">
                                주간<br>총근무
                            </th>
                            <th class="py-2 px-2 text-center font-extrabold text-sky-700 bg-sky-100/70 min-w-[54px]">
                                주간<br>총OT
                            </th>
                        </tr>
                    </thead>
                    <tbody>
                        ${tbodyHtml || `<tr><td colspan="10" class="py-8 text-center text-slate-400">검색된 직원이 없습니다.</td></tr>`}
                    </tbody>
                </table>
            </div>
        </div>
        <div class="text-[11px] text-slate-400 px-1">💡 상단 1주차~${weeks.length}주차 버튼을 터치해 주간표를 전환하세요.</div>
    </div>`;
}

function updateWeekSearch(val) {
    state.weekSearchQuery = val;
    renderApp();
    const inputEl = document.querySelector('input[placeholder*="직원 이름"]');
    if (inputEl) {
        inputEl.focus();
        inputEl.setSelectionRange(inputEl.value.length, inputEl.value.length);
    }
}

function changeMonth(delta) {
    let m = state.currentMonth + delta, y = state.currentYear;
    if (m < 1) { m = 12; y--; }
    if (m > 12) { m = 1; y++; }
    state.currentMonth = m; state.currentYear = y; state.currentWeekIndex = 0;
    state.reqAdminSelectedDate = formatDate(y, m, 1);
    renderApp();
}
function setViewMode(mode) { state.viewMode = mode; renderApp(); }
function setScheduleFilter(filter) { state.scheduleFilter = filter; renderApp(); }
function setWeekIndex(idx) { state.currentWeekIndex = idx; renderApp(); }

function getWorkerMonthlySummary(userId, year, month) {
    const activeSchedules = getActiveSchedules();
    const isAdmin = isViewingAsAdmin();
    let workDays = 0, totalOt = 0, daysInMonth = getDaysInMonth(year, month);
    for (let d = 1; d <= daysInMonth; d++) {
        const dateStr = formatDate(year, month, d);
        if (Object.values(activeSchedules[dateStr] || {}).some(arr => arr.includes(userId))) workDays++;
        totalOt += getUserDailyOt(dateStr, userId, isAdmin);
    }
    const leaveDays = db.leaveRequests.filter(lr => lr.userId === userId && lr.status === 'approved' && lr.date.startsWith(`${year}-${String(month).padStart(2, '0')}`)).length;
    const user = getUserById(userId);
    return {
        workDays,
        totalOt: round1(totalOt),
        leaveDays,
        remainingLeave: Math.max(0, (user ? user.totalLeave : 15) - db.leaveRequests.filter(lr => lr.userId === userId && lr.status === 'approved').length)
    };
}

function openPublishConfirmModal() {
    const { violations } = getOver52hViolations(state.currentYear, state.currentMonth, true);
    let warnHtml = violations.length > 0 ? `
        <div class="bg-rose-50 border border-rose-200 rounded-2xl p-3 text-xs text-rose-800">
            <b>⚠️ 주의: 주 52시간 이상 근무자(${violations.length}건)가 포함되어 있습니다.</b><br>
            ${violations.slice(0, 6).map(v => `${v.user.name}(${v.weekIdx}주차 ${v.totalHours}h)`).join(', ')}${violations.length > 6 ? ' 외' : ''}
        </div>
    ` : '';

    let html = `
        <div class="space-y-4">
            ${warnHtml}
            <div class="bg-indigo-50 border border-indigo-200 rounded-2xl p-3.5 text-xs text-indigo-950 space-y-1.5 leading-relaxed">
                <div class="font-bold text-sm text-indigo-700"><i class="fa-solid fa-bullhorn"></i> 스케줄 공식 배포 안내</div>
                <p>• 현재 가배정된 스케줄과 OT 내역을 <b>전체 근무자에게 공식 공유</b>합니다.</p>
                <p>• 배포 전까지 근무자들은 이전 확정 스케줄만 보게 됩니다.</p>
            </div>
            <button onclick="publishScheduleNow()" class="w-full py-3.5 rounded-2xl bg-indigo-600 hover:bg-indigo-700 text-white font-extrabold text-sm shadow-lg">
                📢 지금 모든 근무자에게 스케줄 배포하기
            </button>
        </div>
    `;
    openModal('스케줄 공식 배포', '', html);
}

/**
 * ==========================================
 * 6. 탭 2: OT 및 주 52시간 관리 전용 창
 * ==========================================
 */
function renderOtManagementTab() {
    const isAdmin = isViewingAsAdmin();
    const activeSchedules = getActiveSchedules();
    const activeExtraOt = getActiveExtraOtLogs();
    const year = state.currentYear, month = state.currentMonth;
    const weeks = getMonthCalendarWeeks(year, month);
    const daysInMonth = getDaysInMonth(year, month);

    const userOtData = db.users.map(u => {
        const weeklyStats = weeks.map(w => {
            let otSum = 0, workSum = 0;
            w.forEach(cell => {
                otSum += getUserDailyOt(cell.dateStr, u.id, isAdmin);
                workSum += getUserDailyTotalWorkHours(cell.dateStr, u.id, isAdmin);
            });
            return { ot: round1(otSum), work: round1(workSum), isOver52: round1(workSum) >= MAX_WEEKLY_WORK_HOURS };
        });

        let monthlyTotalOt = 0, weekdayOtSum = 0, holidayOtSum = 0, monthlyWorkDays = 0, extraOtTotal = 0, monthlyTotalWorkHours = 0;

        for (let d = 1; d <= daysInMonth; d++) {
            const dateStr = formatDate(year, month, d);
            const daySched = activeSchedules[dateStr] || {};
            const isHol = isWeekendOrHoliday(dateStr);
            db.shifts.forEach(s => {
                if ((daySched[s.id] || []).includes(u.id)) {
                    monthlyWorkDays++;
                    const sOt = getShiftOtHoursForDate(s, dateStr);
                    if (sOt > 0) {
                        monthlyTotalOt += sOt;
                        if (isHol) holidayOtSum += sOt;
                        else weekdayOtSum += sOt;
                    }
                }
            });
            const ext = Number(activeExtraOt?.[dateStr]?.[u.id]) || 0;
            if (ext !== 0) {
                monthlyTotalOt += ext;
                extraOtTotal += ext;
            }
            monthlyTotalWorkHours += getUserDailyTotalWorkHours(dateStr, u.id, isAdmin);
        }

        const hasAnyOver52 = weeklyStats.some(ws => ws.isOver52);

        return {
            user: u,
            weeklyStats,
            hasAnyOver52,
            monthlyTotalOt: round1(monthlyTotalOt),
            monthlyTotalWorkHours: round1(monthlyTotalWorkHours),
            weekdayOtSum: round1(weekdayOtSum),
            holidayOtSum: round1(holidayOtSum),
            monthlyWorkDays,
            extraOtTotal: round1(extraOtTotal)
        };
    });

    const totalTeamOt = round1(userOtData.reduce((acc, cur) => acc + cur.monthlyTotalOt, 0));
    const maxUserOt = Math.max(...userOtData.map(d => d.monthlyTotalOt), 1);

    return `
    <div class="p-4 space-y-4">
        <div class="bg-gradient-to-br from-slate-900 via-indigo-950 to-slate-900 rounded-3xl p-4 text-white shadow-md space-y-3">
            <div class="flex items-center justify-between">
                <div>
                    <span class="text-[10px] font-bold uppercase px-2 py-0.5 rounded-md bg-sky-400/20 text-sky-300">
                        ${isAdmin ? '관리자 가배정 기준' : '공식 배포본 기준'}
                    </span>
                    <h2 class="text-base font-bold mt-1">${year}년 ${month}월 인당 OT & 주 52시간 현황</h2>
                </div>
                <div class="flex items-center gap-1 bg-white/10 p-1 rounded-xl">
                    <button onclick="changeMonth(-1)" class="w-7 h-7 rounded-lg hover:bg-white/10 flex items-center justify-center text-xs"><i class="fa-solid fa-chevron-left"></i></button>
                    <span class="text-xs font-bold px-1.5">${month}월</span>
                    <button onclick="changeMonth(1)" class="w-7 h-7 rounded-lg hover:bg-white/10 flex items-center justify-center text-xs"><i class="fa-solid fa-chevron-right"></i></button>
                </div>
            </div>

            <div class="grid grid-cols-3 gap-2 pt-1 text-center">
                <div class="bg-white/5 rounded-2xl py-2">
                    <div class="text-[10px] text-slate-400">전 직원 월 총 OT</div>
                    <div class="text-sm font-extrabold text-amber-300 mt-0.5">${totalTeamOt}시간</div>
                </div>
                <div class="bg-white/5 rounded-2xl py-2">
                    <div class="text-[10px] text-slate-400">1인당 평균 OT</div>
                    <div class="text-sm font-bold text-white mt-0.5">${round1(totalTeamOt / (db.users.length || 1))}시간</div>
                </div>
                <div class="bg-white/5 rounded-2xl py-2">
                    <div class="text-[10px] text-slate-400">주 52h 이상자</div>
                    <div class="text-sm font-extrabold ${userOtData.filter(d => d.hasAnyOver52).length > 0 ? 'text-rose-400' : 'text-emerald-300'} mt-0.5">${userOtData.filter(d => d.hasAnyOver52).length}명</div>
                </div>
            </div>
        </div>

        <div class="flex bg-slate-200/80 p-1 rounded-2xl">
            <button onclick="setOtSubTab('weekly')" class="flex-1 py-2 rounded-xl text-xs font-bold transition ${state.otViewSubTab === 'weekly' ? 'bg-white text-indigo-600 shadow-sm' : 'text-slate-600'}">
                📅 주별 OT & 주 52시간 점검표
            </button>
            <button onclick="setOtSubTab('monthly')" class="flex-1 py-2 rounded-xl text-xs font-bold transition ${state.otViewSubTab === 'monthly' ? 'bg-white text-indigo-600 shadow-sm' : 'text-slate-600'}">
                📊 월별 인당 총 OT 상세분석
            </button>
        </div>

        ${state.otViewSubTab === 'weekly' ? renderWeeklyOtTable(year, month, weeks, userOtData) : renderMonthlyOtDetail(year, month, userOtData, maxUserOt)}
    </div>`;
}

function setOtSubTab(subTab) { state.otViewSubTab = subTab; renderApp(); }

function renderWeeklyOtTable(year, month, weeks, userOtData) {
    return `
    <div class="bg-white rounded-3xl p-4 border border-slate-200 shadow-sm space-y-3">
        <div>
            <h3 class="font-bold text-sm text-slate-800">주별 인당 OT 및 총 근로시간(52h) 현황</h3>
            <p class="text-[11px] text-slate-400">상단은 <b>OT 시간</b>, 하단 괄호는 <b>주간 7일 연속 총 근로시간(전달 포함)</b>입니다.</p>
        </div>
        <div class="overflow-x-auto max-h-[60vh] -mx-2 px-2">
            <table class="w-full text-left border-collapse text-xs">
                <thead class="sticky top-0 bg-slate-50 z-10">
                    <tr class="border-b border-slate-200 text-[11px] text-slate-400">
                        <th class="py-2.5 px-2 font-bold">직원명</th>
                        ${weeks.map((w, idx) => {
                            const f = w[0], l = w[6];
                            return `<th class="py-2.5 px-1 font-semibold text-center">${idx + 1}주<div class="text-[9px] font-normal text-slate-400">${f.month}/${f.day}~${l.month}/${l.day}</div></th>`;
                        }).join('')}
                        <th class="py-2.5 px-2 font-bold text-right text-indigo-600">월 총OT</th>
                    </tr>
                </thead>
                <tbody class="divide-y divide-slate-100">
                    ${userOtData.map(row => `
                    <tr class="${row.hasAnyOver52 ? 'bg-rose-50/60' : ''}">
                        <td class="py-3 px-2 font-bold text-slate-800 whitespace-nowrap">
                            <div>${row.user.name}</div>
                            ${row.hasAnyOver52 ? `<span class="inline-block mt-0.5 text-[9px] font-extrabold px-1.5 py-0.2 rounded bg-rose-600 text-white">🚨52h초과</span>` : ''}
                        </td>
                        ${row.weeklyStats.map(ws => `
                        <td class="py-2.5 px-1 text-center">
                            <div class="px-1 py-0.5 rounded-md font-bold ${ws.isOver52 ? 'bg-rose-600 text-white shadow-sm' : ws.ot > 0 ? 'bg-sky-50 text-sky-700' : 'text-slate-300'}">
                                +${ws.ot}h
                            </div>
                            <div class="text-[9px] mt-0.5 ${ws.isOver52 ? 'text-rose-600 font-extrabold' : 'text-slate-400'}">
                                (${ws.work}h)
                            </div>
                        </td>
                        `).join('')}
                        <td class="py-3 px-2 text-right whitespace-nowrap">
                            <div class="font-extrabold text-indigo-600">${row.monthlyTotalOt}h</div>
                            <div class="text-[9px] text-slate-400">총${row.monthlyTotalWorkHours}h</div>
                        </td>
                    </tr>
                    `).join('')}
                </tbody>
            </table>
        </div>
    </div>`;
}

function renderMonthlyOtDetail(year, month, userOtData, maxUserOt) {
    return `
    <div class="bg-white rounded-3xl p-4 border border-slate-200 shadow-sm space-y-3">
        <h3 class="font-bold text-sm text-slate-800">${month}월 인당 전체 OT 상세 (평일연장 + 휴일특근)</h3>
        <div class="space-y-3 pt-1 max-h-[60vh] overflow-y-auto pr-1">
            ${userOtData.map(d => {
                const pct = maxUserOt > 0 ? Math.round((d.monthlyTotalOt / maxUserOt) * 100) : 0;
                return `
                <div class="p-3 rounded-2xl ${d.hasAnyOver52 ? 'bg-rose-50 border border-rose-300' : 'bg-slate-50 border border-slate-100'} space-y-1.5">
                    <div class="flex items-center justify-between">
                        <div class="flex items-center gap-1.5">
                            <span class="font-bold text-xs text-slate-800">${d.user.name} <span class="text-[11px] font-normal text-slate-400">(${d.user.role})</span></span>
                            ${d.hasAnyOver52 ? `<span class="text-[10px] font-extrabold px-2 py-0.5 rounded-full bg-rose-600 text-white">🚨 주 52시간 이상 주간 있음</span>` : ''}
                        </div>
                        <span class="text-sm font-extrabold text-indigo-600">OT ${d.monthlyTotalOt}h <span class="text-[11px] font-normal text-slate-400">(${d.monthlyWorkDays}일)</span></span>
                    </div>
                    <div class="w-full h-3 bg-slate-200/70 rounded-full overflow-hidden">
                        <div class="h-full ${d.hasAnyOver52 ? 'bg-rose-600' : 'bg-gradient-to-r from-indigo-500 to-sky-500'} rounded-full" style="width: ${Math.max(pct, d.monthlyTotalOt > 0 ? 8 : 0)}%"></div>
                    </div>
                    <div class="flex items-center justify-between text-[10px] text-slate-500 pt-0.5">
                        <span>평일 연장 OT: <b>${d.weekdayOtSum}h</b> · 주말/공휴일 OT: <b class="text-rose-600">${d.holidayOtSum}h</b></span>
                        <span>월 총 실근로: <b>${d.monthlyTotalWorkHours}h</b></span>
                    </div>
                </div>`;
            }).join('')}
        </div>
    </div>`;
}

/**
 * ==========================================
 * 7. 날짜 클릭 모달 (휴가자/불가자 명단 & 시프트 수동 편집)
 * ==========================================
 */
function openDayScheduleModal(dateStr) {
    const isAdmin = isViewingAsAdmin();
    const activeSchedules = getActiveSchedules();
    const activeExtraOt = getActiveExtraOtLogs();

    const dow = getDayOfWeekName(dateStr), daySched = activeSchedules[dateStr] || {}, approvedLeaves = db.leaveRequests.filter(lr => lr.date === dateStr && lr.status === 'approved');
    const unavailsToday = (db.holidayUnavailables || []).filter(item => item.date === dateStr);
    const isHol = isWeekendOrHoliday(dateStr);
    const isCustomHol = (db.holidays || []).includes(dateStr);

    const assignedSet = new Set(); Object.values(daySched).forEach(arr => arr.forEach(uid => assignedSet.add(uid)));
    const leaveSet = new Set(approvedLeaves.map(lr => lr.userId));

    let shiftsHtml = db.shifts.map(s => {
        const c = getShiftColor(s.colorId), assignedIds = daySched[s.id] || [];
        const sOt = getShiftOtHoursForDate(s, dateStr);
        const sWork = getShiftTotalWorkHoursForDate(s, dateStr);

        let workersHtml = assignedIds.length === 0 ? `<span class="text-xs text-slate-400">배정 인원 없음</span>` : assignedIds.map(uid => {
            const u = getUserById(uid);
            if (!u) return '';
            const extraOt = Number(activeExtraOt?.[dateStr]?.[uid]) || 0;
            const totalOt = round1(sOt + extraOt);
            const weekWork = getUserWeeklyWorkHoursByDateStr(dateStr, uid, isAdmin);
            const isOver52 = weekWork >= MAX_WEEKLY_WORK_HOURS;
            return `
            <div class="bg-white border ${isOver52 ? 'border-rose-500 ring-1 ring-rose-500' : 'border-slate-200'} px-2.5 py-1.5 rounded-xl flex gap-1.5 items-center">
                <span class="text-xs font-bold">${u.name}</span>
                <span class="text-[10px] font-bold px-1.5 py-0.2 rounded ${isOver52 ? 'bg-rose-600 text-white' : 'bg-slate-100 text-slate-600'}">주${weekWork}h${isOver52 ? '🚨' : ''}</span>
                ${totalOt > 0 ? `<span class="text-[10px] font-extrabold px-1.5 py-0.2 rounded ${isHol ? 'bg-rose-100 text-rose-700' : 'bg-sky-100 text-sky-700'}">OT ${totalOt}h</span>` : ''}
                ${isAdmin ? `<button onclick="removeWorkerFromShift('${dateStr}', '${s.id}', '${uid}')" class="text-rose-500 ml-1"><i class="fa-solid fa-circle-xmark"></i></button>` : ''}
            </div>`;
        }).join('');

        let adminAddHtml = isAdmin ? `
            <div class="pt-2 flex gap-2">
                <select id="add-worker-${s.id}" class="flex-1 border rounded-xl px-2 py-1.5 text-xs bg-white">
                    <option value="">+ 근무자 배정 선택 (투입시 +${sWork}h)...</option>
                    ${db.users.map(u => {
                        if (assignedIds.includes(u.id)) return '';
                        const allowed = canUserWorkShift(u, s.id);
                        const isLv = leaveSet.has(u.id);
                        const isUnavail = isHol && isUserHolidayUnavailable(u.id, dateStr);
                        const curWeekWork = getUserWeeklyWorkHoursByDateStr(dateStr, u.id, true);
                        const afterWork = round1(curWeekWork + (assignedSet.has(u.id) ? 0 : sWork));
                        const willOver52 = afterWork >= MAX_WEEKLY_WORK_HOURS;

                        const disabledAttr = (!allowed || isLv || isUnavail) ? 'disabled' : '';
                        let statusTag = `(주 ${curWeekWork}h→${afterWork}h)`;
                        if (isLv) statusTag = '[휴가중]';
                        else if (isUnavail) statusTag = '[주말/휴일 근무불가 신청됨]';
                        else if (!allowed) statusTag = '[고정시간 외 불가]';
                        else if (willOver52) statusTag = `⚠️[52h초과주의: ${afterWork}h]`;

                        return `<option value="${u.id}" ${disabledAttr}>${u.name} ${statusTag}</option>`;
                    }).join('')}
                </select>
                <button onclick="addWorkerToShift('${dateStr}', '${s.id}')" class="bg-slate-800 text-white text-xs font-bold px-3 rounded-xl">배정</button>
            </div>
        ` : '';

        return `
        <div style="background:${c.bg}; border:1px solid ${c.border}" class="p-3.5 rounded-2xl space-y-2">
            <div class="flex justify-between items-center">
                <div>
                    <span style="color:${c.text}" class="font-extrabold text-sm">${s.name}</span>
                    <span class="text-xs text-slate-600 ml-1">${s.time}</span>
                    <span class="text-[10px] font-bold px-1.5 py-0.5 rounded bg-white/80 ${isHol ? 'text-rose-600' : 'text-slate-700'} ml-1">${isHol ? `휴일OT ${sOt}h` : `근로 ${sWork}h (OT ${sOt}h)`}</span>
                </div>
                <span style="color:${c.text}" class="text-xs font-bold">${assignedIds.length}/${s.reqCount}명</span>
            </div>
            <div class="flex flex-wrap gap-1.5 pt-1">${workersHtml}</div>
            ${adminAddHtml}
        </div>`;
    }).join('');

    let holidayControlHtml = isAdmin ? `
        <div class="p-3 rounded-2xl ${isHol ? 'bg-rose-50 border border-rose-200' : 'bg-slate-100 border border-slate-200'} flex items-center justify-between">
            <div>
                <div class="text-xs font-bold ${isHol ? 'text-rose-700' : 'text-slate-700'}">
                    ${isHol ? '🔴 주말/공휴일 (전시간 OT 적용중)' : '⚪ 평일 정상 근무일'}
                </div>
                <div class="text-[10px] text-slate-500">공휴일 지정 시 전 근무시간이 OT로 산정됩니다.</div>
            </div>
            <button onclick="toggleCustomHoliday('${dateStr}')" class="px-3 py-1.5 rounded-xl text-xs font-bold ${isCustomHol ? 'bg-slate-800 text-white' : 'bg-rose-600 text-white'} shrink-0">
                ${isCustomHol ? '공휴일 해제' : '공휴일 지정'}
            </button>
        </div>
    ` : '';

    const myUnavail = !isAdmin && isHol ? isUserHolidayUnavailable(state.currentUser.id, dateStr) : false;
    let workerHolidayQuickBtn = (!isAdmin && isHol) ? `
        <div class="p-3 rounded-2xl bg-slate-100 border border-slate-200 flex items-center justify-between">
            <div class="text-xs">
                <div class="font-bold text-slate-800">🚫 이 주말/공휴일에 근무가 불가능하신가요?</div>
                <div class="text-[11px] text-slate-500">${myUnavail ? '현재 근무 불가로 신청되어 있습니다.' : '근무 불가 신청 시 관리자 주말 선정에서 제외됩니다.'}</div>
            </div>
            <button onclick="quickToggleMyHolidayUnavailable('${dateStr}')" class="px-3 py-2 rounded-xl text-xs font-bold ${myUnavail ? 'bg-slate-700 text-white' : 'bg-rose-600 text-white'} shrink-0">
                ${myUnavail ? '불가 신청 취소' : '근무 불가 신청'}
            </button>
        </div>
    ` : '';

    let html = `
        <div class="space-y-4">
            ${holidayControlHtml}
            ${workerHolidayQuickBtn}
            <div class="grid grid-cols-2 gap-2.5">
                <div class="bg-rose-50 border border-rose-200 rounded-2xl p-3">
                    <div class="text-[11px] font-bold text-rose-700 mb-1">🌴 승인 휴가자 (${approvedLeaves.length}명)</div>
                    <div class="text-xs space-y-1 max-h-28 overflow-y-auto">${approvedLeaves.length === 0 ? '<span class="text-slate-400">없음</span>' : approvedLeaves.map(lr => `<div><b>${getUserById(lr.userId)?.name}</b> (${lr.type})</div>`).join('')}</div>
                </div>
                <div class="bg-slate-100 border border-slate-200 rounded-2xl p-3">
                    <div class="text-[11px] font-bold text-slate-700 mb-1">🚫 주말/휴일 근무불가 (${unavailsToday.length}명)</div>
                    <div class="text-xs space-y-1 max-h-28 overflow-y-auto">${unavailsToday.length === 0 ? '<span class="text-slate-400">없음</span>' : unavailsToday.map(u => `<div><b>${getUserById(u.userId)?.name}</b> <span class="text-[10px] text-slate-500">(${u.reason})</span></div>`).join('')}</div>
                </div>
            </div>
            <div class="space-y-2.5">${shiftsHtml}</div>
        </div>`;
    openModal(`${dateStr} (${dow}) 상세 및 편집`, '', html);
}

function quickToggleMyHolidayUnavailable(dateStr) {
    if (!db.holidayUnavailables) db.holidayUnavailables = [];
    const uid = state.currentUser.id;
    if (isUserHolidayUnavailable(uid, dateStr)) {
        db.holidayUnavailables = db.holidayUnavailables.filter(item => !(item.userId === uid && item.date === dateStr));
        showToast(`${dateStr} 근무 불가 신청이 취소되었습니다.`, 'info');
    } else {
        db.holidayUnavailables.push({
            id: 'hu_' + Date.now(),
            userId: uid,
            date: dateStr,
            reason: '주말/공휴일 개인 일정',
            createdAt: new Date().toLocaleString('ko-KR')
        });
        showToast(`${dateStr} 주말/공휴일 근무 불가 신청이 등록되었습니다.`, 'success');
    }
    saveData();
    openDayScheduleModal(dateStr);
    renderApp();
}

function toggleCustomHoliday(dateStr) {
    if (!db.holidays) db.holidays = [...DEFAULT_KR_HOLIDAYS];
    if (db.holidays.includes(dateStr)) {
        db.holidays = db.holidays.filter(d => d !== dateStr);
        showToast(`${dateStr} 공휴일 지정이 해제되었습니다.`, 'info');
    } else {
        db.holidays.push(dateStr);
        showToast(`${dateStr}이 공휴일로 지정되었습니다.`, 'success');
    }
    markScheduleDirty();
    openDayScheduleModal(dateStr);
    renderApp();
}

function removeWorkerFromShift(dateStr, shiftId, userId) {
    if (!db.schedules[dateStr] || !db.schedules[dateStr][shiftId]) return;
    db.schedules[dateStr][shiftId] = db.schedules[dateStr][shiftId].filter(id => id !== userId);
    markScheduleDirty(); openDayScheduleModal(dateStr); renderApp();
}

function addWorkerToShift(dateStr, shiftId) {
    const userId = document.getElementById(`add-worker-${shiftId}`)?.value;
    if (!userId) return;
    const u = getUserById(userId);
    if (!canUserWorkShift(u, shiftId)) {
        return showToast(`${u.name}님은 지정된 전용 근무시간에만 배정할 수 있습니다.`, 'error');
    }
    if (isWeekendOrHoliday(dateStr) && isUserHolidayUnavailable(userId, dateStr)) {
        return showToast(`${u.name}님은 해당 휴일에 근무 불가 신청을 한 상태입니다.`, 'error');
    }

    if (!db.schedules[dateStr]) db.schedules[dateStr] = {};
    db.shifts.forEach(s => { if (db.schedules[dateStr][s.id]) db.schedules[dateStr][s.id] = db.schedules[dateStr][s.id].filter(id => id !== userId); });
    if (!db.schedules[dateStr][shiftId]) db.schedules[dateStr][shiftId] = [];
    db.schedules[dateStr][shiftId].push(userId);

    const weekHours = getUserWeeklyWorkHoursByDateStr(dateStr, userId, true);
    if (weekHours >= MAX_WEEKLY_WORK_HOURS) {
        showToast(`🚨 주의: ${u.name}님의 해당 주 근무시간이 ${weekHours}시간(52h 이상)이 되었습니다!`, 'warning');
    }

    markScheduleDirty(); openDayScheduleModal(dateStr); renderApp();
}

function openAutoScheduleConfirmModal(defaultWeekIdx = state.currentWeekIndex) {
    const weeks = getMonthCalendarWeeks(state.currentYear, state.currentMonth);
    if (defaultWeekIdx >= weeks.length) defaultWeekIdx = 0;

    const weekOptionsHtml = weeks.map((w, idx) => {
        const f = w[0], l = w[6];
        return `<option value="${idx}" ${idx === defaultWeekIdx ? 'selected' : ''}>${idx + 1}주차 (${f.month}월 ${f.day}일 일요일 ~ ${l.month}월 ${l.day}일 토요일)</option>`;
    }).join('');

    openModal('2단계: 주간 단위 스마트 자동 가배정', '월 전체가 아닌 선택한 주간(7일)만 독립적으로 자동 스케줄링합니다.', `
        <div class="space-y-4">
            <div>
                <label class="block text-xs font-extrabold text-indigo-900 mb-1.5">📅 자동 스케줄링할 대상 주차 선택</label>
                <select id="auto-target-week-select" class="w-full bg-indigo-50 border-2 border-indigo-300 rounded-2xl px-3.5 py-3 text-xs font-extrabold text-indigo-900 focus:outline-none">
                    ${weekOptionsHtml}
                </select>
            </div>
            <div class="bg-slate-50 border border-slate-200 rounded-2xl p-3.5 text-xs text-slate-700 space-y-1.5">
                <div class="font-bold text-slate-900">⚡ 주간 자동배정 핵심 로직</div>
                <div>1. <b>선택 주간 집중 배정</b>: 다른 주차의 스케줄은 건드리지 않고, 선택한 주간(일~토 7일)만 자동 배정합니다.</div>
                <div>2. <b>주말 선배정 보존 & 주 52h 준수</b>: 해당 주간의 주말 근무시간을 먼저 합산한 뒤 주 52시간을 넘지 않도록 평일 근무를 배정합니다.</div>
            </div>
            <label class="flex items-center gap-2.5 p-3 rounded-2xl bg-slate-100 cursor-pointer">
                <input id="auto-preserve-weekend" type="checkbox" checked class="w-4 h-4 accent-indigo-600 rounded">
                <span class="text-xs font-bold text-slate-800">해당 주간에 선정해 둔 주말·공휴일 스케줄 유지하기 (권장)</span>
            </label>
            <label class="flex items-center gap-2.5 p-3 rounded-2xl bg-slate-100 cursor-pointer">
                <input id="auto-include-pending" type="checkbox" checked class="w-4 h-4 accent-indigo-600 rounded">
                <span class="text-xs font-semibold text-slate-700">대기중인 희망 근무 신청도 반영하기</span>
            </label>
            <button onclick="confirmRunAutoSchedule()" class="w-full py-3.5 rounded-2xl bg-indigo-600 text-white font-bold text-sm shadow-lg">⚡ 선택한 주간만 자동 가배정 실행</button>
        </div>
    `);
}

function confirmRunAutoSchedule() {
    const targetWeekIdx = parseInt(document.getElementById('auto-target-week-select')?.value || state.currentWeekIndex, 10);
    const preserveWeekend = document.getElementById('auto-preserve-weekend')?.checked ?? true;
    const includePending = document.getElementById('auto-include-pending')?.checked ?? true;
    closeModal();
    runWeeklySmartAutoSchedule(state.currentYear, state.currentMonth, targetWeekIdx, false, includePending, preserveWeekend);
}

/**
 * ==========================================
 * 8. 탭 3: 근무자 신청 화면 & 관리자 신청 확인창 (달력 일별뷰 + 사람별 현황 + 승인/반려 확정 잠금)
 * ==========================================
 */
function renderWorkerRequestsTab() {
    const myUser = getUserById(state.currentUser.id) || state.currentUser;
    const myId = myUser.id;
    const year = state.currentYear, month = state.currentMonth;
    const daysInMonth = getDaysInMonth(year, month);

    // 기존 기록 모두 보존 (최신 신청순/날짜순 정렬)
    const myLeaves = db.leaveRequests.filter(r => r.userId === myId).sort((a,b)=>b.date.localeCompare(a.date));
    const myPrefs = db.shiftPreferences.filter(r => r.userId === myId).sort((a,b)=>b.date.localeCompare(a.date));
    const myUnavails = (db.holidayUnavailables || []).filter(r => r.userId === myId).sort((a,b)=>b.date.localeCompare(a.date));

    const defaultDate = formatDate(year, month, 15);
    const allowedShifts = db.shifts.filter(s => canUserWorkShift(myUser, s.id));

    const monthHolidayOptions = [];
    for (let d = 1; d <= daysInMonth; d++) {
        const dStr = formatDate(year, month, d);
        if (isWeekendOrHoliday(dStr)) {
            monthHolidayOptions.push({ dateStr: dStr, label: `${month}월 ${d}일 (${getDayOfWeekName(dStr)} · ${getHolidayBadgeLabel(dStr)})` });
        }
    }

    let unavailListHtml = myUnavails.map(item => `
        <div class="p-3 rounded-2xl bg-rose-50/60 border border-rose-200 flex justify-between items-center">
            <div>
                <span class="font-bold text-xs text-rose-800">${item.date} (${getDayOfWeekName(item.date)})</span>
                <span class="text-[10px] font-bold bg-rose-600 text-white px-2 py-0.5 rounded-md ml-1">주말·휴일 근무불가</span>
                <p class="text-[11px] text-slate-600 mt-0.5">사유: ${item.reason}</p>
            </div>
            <button onclick="cancelHolidayUnavailable('${item.id}')" class="text-xs font-bold text-rose-600 px-2 py-1">취소</button>
        </div>
    `).join('') || '<p class="text-xs text-slate-400">등록된 주말/공휴일 근무 불가 내역이 없습니다.</p>';

    let leavesHtml = myLeaves.map(r => `
        <div class="p-3 rounded-2xl border ${r.status !== 'pending' ? 'bg-slate-50' : 'bg-white'} flex justify-between items-center">
            <div>
                <div class="flex items-center gap-1.5">
                    <span class="font-bold text-xs">${r.date} (${getDayOfWeekName(r.date)})</span>
                    <span class="text-[10px] bg-rose-100 text-rose-700 px-2 py-0.5 rounded-md font-bold">${r.type}</span>
                    ${renderStatusBadge(r.status)}
                </div>
                <p class="text-[11px] text-slate-500 mt-1">사유: ${r.reason || '-'} ${r.decidedAt ? `<span class="text-[10px] text-slate-400">· 처리: ${r.decidedAt}</span>` : ''}</p>
            </div>
            ${r.status==='pending'?`<button onclick="cancelWorkerRequest('leave', '${r.id}')" class="text-xs font-bold text-rose-500 px-2 py-1">취소</button>`:'<span class="text-[10px] text-slate-400 font-semibold">🔒확정됨</span>'}
        </div>
    `).join('') || '<p class="text-xs text-slate-400">신청 내역 없음</p>';

    let prefsHtml = myPrefs.map(sp => {
        const s = getShiftById(sp.shiftId);
        return `
        <div class="p-3 rounded-2xl border ${sp.status !== 'pending' ? 'bg-slate-50' : 'bg-white'} flex justify-between items-center">
            <div>
                <div class="flex items-center gap-1.5">
                    <span class="font-bold text-xs">${sp.date} (${getDayOfWeekName(sp.date)})</span>
                    <span class="text-[10px] bg-indigo-100 text-indigo-700 px-2 py-0.5 rounded-md font-bold">${s ? `${s.name}` : '시프트'} (${sp.priority})</span>
                    ${renderStatusBadge(sp.status)}
                </div>
                <p class="text-[11px] text-slate-500 mt-1">메모: ${sp.note || '-'} ${sp.decidedAt ? `<span class="text-[10px] text-slate-400">· 처리: ${sp.decidedAt}</span>` : ''}</p>
            </div>
            ${sp.status==='pending'?`<button onclick="cancelWorkerRequest('pref', '${sp.id}')" class="text-xs font-bold text-rose-500 px-2 py-1">취소</button>`:'<span class="text-[10px] text-slate-400 font-semibold">🔒확정됨</span>'}
        </div>`;
    }).join('') || '<p class="text-xs text-slate-400">신청 내역 없음</p>';

    return `
    <div class="p-4 space-y-5">
        <div class="bg-indigo-50 border border-indigo-200 rounded-2xl p-3 text-xs text-indigo-900">
            💡 <b>안내</b>: 승인 또는 반려로 결정된 신청 건은 확정되어 변경되지 않습니다. 변경이 필요할 경우 위 신청 폼에서 <b>다시 신청</b>해 주세요. (기존 기록도 모두 보존됩니다)
        </div>

        <div class="bg-white rounded-3xl p-4 border-2 border-rose-200 shadow-sm space-y-3">
            <div>
                <h3 class="font-bold text-sm text-rose-700"><i class="fa-solid fa-calendar-xmark"></i> 주말·공휴일 근무 불가 신청</h3>
                <p class="text-[11px] text-slate-500">주말이나 공휴일에 개인 사정으로 출근이 불가능할 때 등록하세요.</p>
            </div>
            <div class="grid grid-cols-1 gap-2">
                <div>
                    <label class="text-[11px] font-semibold text-slate-600">불가능한 주말·공휴일 선택 (${year}년 ${month}월)</label>
                    <select id="worker-unavail-date" class="w-full bg-rose-50/50 border border-rose-200 rounded-xl px-3 py-2.5 text-xs font-bold text-slate-800 mt-1">
                        ${monthHolidayOptions.map(opt => `<option value="${opt.dateStr}">${opt.label}</option>`).join('')}
                    </select>
                </div>
                <div>
                    <label class="text-[11px] font-semibold text-slate-600">불가 사유</label>
                    <input id="worker-unavail-reason" type="text" placeholder="예: 가족 행사, 주말 학원 등" class="w-full bg-slate-50 border rounded-xl px-3 py-2 text-xs mt-1">
                </div>
            </div>
            <button onclick="submitHolidayUnavailable()" class="w-full py-3 rounded-2xl bg-slate-900 hover:bg-slate-800 text-white font-bold text-xs shadow-sm">
                🚫 주말·공휴일 근무 불가 등록하기
            </button>
        </div>

        <div class="bg-white rounded-3xl p-4 border shadow-sm space-y-3">
            <h3 class="font-bold text-sm text-slate-800"><i class="fa-solid fa-umbrella-beach text-rose-500"></i> 평일 휴가 (연차/반차) 신청</h3>
            <div class="grid grid-cols-2 gap-2">
                <div><label class="text-[11px] font-semibold text-slate-500">날짜</label><input id="worker-leave-date" type="date" value="${defaultDate}" class="w-full bg-slate-50 border rounded-xl px-3 py-2 text-xs"></div>
                <div><label class="text-[11px] font-semibold text-slate-500">유형</label><select id="worker-leave-type" class="w-full bg-slate-50 border rounded-xl px-3 py-2 text-xs"><option value="연차">연차</option><option value="반차">반차</option><option value="정기휴무">정기휴무</option></select></div>
            </div>
            <div><label class="text-[11px] font-semibold text-slate-500">사유</label><input id="worker-leave-reason" type="text" placeholder="예: 병원 진료" class="w-full bg-slate-50 border rounded-xl px-3 py-2.5 text-xs"></div>
            <button onclick="submitWorkerLeaveRequest()" class="w-full py-3 rounded-2xl bg-rose-600 text-white font-bold text-xs shadow-sm">휴가 제출하기</button>
        </div>

        <div class="bg-white rounded-3xl p-4 border shadow-sm space-y-3">
            <h3 class="font-bold text-sm text-slate-800"><i class="fa-solid fa-clock text-indigo-500"></i> 희망 근무 시프트 신청</h3>
            <div class="grid grid-cols-2 gap-2">
                <div><label class="text-[11px] font-semibold text-slate-500">날짜</label><input id="worker-pref-date" type="date" value="${defaultDate}" class="w-full bg-slate-50 border rounded-xl px-3 py-2 text-xs"></div>
                <div><label class="text-[11px] font-semibold text-slate-500">희망 시프트</label><select id="worker-pref-shift" class="w-full bg-slate-50 border rounded-xl px-3 py-2 text-xs">${allowedShifts.map(s => `<option value="${s.id}">${s.name} (${s.time})</option>`).join('')}</select></div>
            </div>
            <div class="grid grid-cols-3 gap-2">
                <div><label class="text-[11px] font-semibold text-slate-500">순위</label><select id="worker-pref-priority" class="w-full bg-slate-50 border rounded-xl px-2 py-2 text-xs"><option>1순위</option><option>2순위</option></select></div>
                <div class="col-span-2"><label class="text-[11px] font-semibold text-slate-500">메모</label><input id="worker-pref-note" type="text" placeholder="선호 사유" class="w-full bg-slate-50 border rounded-xl px-3 py-2 text-xs"></div>
            </div>
            <button onclick="submitWorkerShiftPref()" class="w-full py-3 rounded-2xl bg-indigo-600 text-white font-bold text-xs shadow-sm">희망 시프트 제출하기</button>
        </div>

        <div class="bg-white rounded-3xl p-4 border shadow-sm space-y-3">
            <h3 class="font-bold text-sm text-slate-800">나의 전체 신청 이력 (과거 기록 보존)</h3>
            <div class="space-y-2"><div class="text-xs font-bold text-rose-600">🚫 주말·공휴일 근무 불가 내역 (${myUnavails.length}건)</div>${unavailListHtml}</div>
            <div class="space-y-2 pt-2 border-t"><div class="text-xs font-bold text-slate-500">🌴 휴가 신청 이력 (${myLeaves.length}건)</div>${leavesHtml}</div>
            <div class="space-y-2 pt-2 border-t"><div class="text-xs font-bold text-slate-500">⏰ 희망 시프트 신청 이력 (${myPrefs.length}건)</div>${prefsHtml}</div>
        </div>
    </div>`;
}

function submitHolidayUnavailable() {
    const dateStr = document.getElementById('worker-unavail-date')?.value;
    const reason = document.getElementById('worker-unavail-reason')?.value.trim() || '주말/공휴일 개인 사정';
    if (!dateStr) return showToast('날짜를 선택해주세요.', 'warning');

    if (!db.holidayUnavailables) db.holidayUnavailables = [];
    if (isUserHolidayUnavailable(state.currentUser.id, dateStr)) {
        return showToast('이미 해당 날짜에 근무 불가 신청이 등록되어 있습니다.', 'warning');
    }

    db.holidayUnavailables.push({
        id: 'hu_' + Date.now(),
        userId: state.currentUser.id,
        date: dateStr,
        reason,
        createdAt: new Date().toLocaleString('ko-KR')
    });
    saveData();
    renderApp();
    showToast('주말·공휴일 근무 불가 신청이 등록되었습니다.', 'success');
}

function cancelHolidayUnavailable(id) {
    db.holidayUnavailables = (db.holidayUnavailables || []).filter(item => item.id !== id);
    saveData();
    renderApp();
    showToast('근무 불가 신청이 취소되었습니다.', 'info');
}

function renderStatusBadge(status) {
    if (status === 'approved') return `<span class="text-[10px] font-bold px-2 py-0.5 rounded-full bg-emerald-100 text-emerald-700">승인확정</span>`;
    if (status === 'rejected') return `<span class="text-[10px] font-bold px-2 py-0.5 rounded-full bg-slate-200 text-slate-600">반려확정</span>`;
    return `<span class="text-[10px] font-bold px-2 py-0.5 rounded-full bg-amber-100 text-amber-700">대기중</span>`;
}

// [핵심 요구사항 2 & 3] 재신청 시 기존의 승인/반려된 과거 기록을 지우지 않고 그대로 보존하며, 대기중인 중복 건만 막음!
function submitWorkerLeaveRequest() {
    const d = document.getElementById('worker-leave-date').value;
    const t = document.getElementById('worker-leave-type').value;
    const r = document.getElementById('worker-leave-reason').value.trim();
    if (!d) return showToast('날짜를 선택해주세요.', 'warning');

    // 현재 '대기중(pending)'이거나 이미 '승인됨(approved)'인 동일 날짜 건이 있으면 안내 (반려된 건이 있을 때는 재신청 허용 및 기존 기록 보존!)
    const activeSameDate = db.leaveRequests.find(lr => lr.userId === state.currentUser.id && lr.date === d && (lr.status === 'pending' || lr.status === 'approved'));
    if (activeSameDate) {
        return showToast(`해당 날짜에 이미 ${activeSameDate.status === 'approved' ? '승인 확정된' : '대기중인'} 휴가 신청이 있습니다.`, 'warning');
    }

    db.leaveRequests.push({
        id: 'lr_' + Date.now(),
        userId: state.currentUser.id,
        date: d,
        type: t,
        reason: r || '개인 사유',
        status: 'pending',
        createdAt: new Date().toLocaleString('ko-KR')
    });
    saveData();
    renderApp();
    showToast('휴가 신청이 등록되었습니다.', 'success');
}

// [핵심 요구사항 2 & 3] 개인 시프트 신청도 기존 승인/반려 기록을 삭제하지 않고 새 신청 이력으로 추가!
function submitWorkerShiftPref() {
    const d = document.getElementById('worker-pref-date').value;
    const s = document.getElementById('worker-pref-shift').value;
    const p = document.getElementById('worker-pref-priority').value;
    const n = document.getElementById('worker-pref-note').value.trim();
    if (!d || !s) return showToast('날짜와 시프트를 선택해주세요.', 'warning');

    // 아직 '대기중(pending)'인 동일 날짜 신청 건이 있을 때만 대기 건을 교체하고, 이미 승인/반려된 과거 기록은 절대 지우지 않고 보존!
    db.shiftPreferences = db.shiftPreferences.filter(sp => !(sp.userId === state.currentUser.id && sp.date === d && sp.status === 'pending'));

    db.shiftPreferences.push({
        id: 'sp_' + Date.now(),
        userId: state.currentUser.id,
        date: d,
        shiftId: s,
        priority: p,
        note: n || '희망 근무 신청',
        status: 'pending',
        createdAt: new Date().toLocaleString('ko-KR')
    });
    saveData();
    renderApp();
    showToast('희망 시프트 신청이 등록되었습니다. (기존 기록 보존)', 'success');
}

function cancelWorkerRequest(kind, id) {
    if (kind === 'leave') {
        const item = db.leaveRequests.find(r => r.id === id);
        if (item && item.status !== 'pending') return showToast('이미 승인/반려가 확정된 기록은 삭제할 수 없습니다.', 'error');
        db.leaveRequests = db.leaveRequests.filter(r => r.id !== id);
    } else {
        const item = db.shiftPreferences.find(r => r.id === id);
        if (item && item.status !== 'pending') return showToast('이미 승인/반려가 확정된 기록은 삭제할 수 없습니다.', 'error');
        db.shiftPreferences = db.shiftPreferences.filter(r => r.id !== id);
    }
    saveData();
    renderApp();
}

/**
 * ==========================================
 * [핵심 요구사항 2, 3, 4] 관리자 스케줄 신청 확인창
 * - 승인/반려 한 번 결정 시 잠금 처리 (재신청 전까지 변경 불가)
 * - 3가지 뷰 제공: 1) 📋 전체 목록(기록보존) / 2) 📅 달력(일별) 보기 / 3) 👤 사람별 신청현황
 * ==========================================
 */
function renderAdminRequestsTab() {
    const pendingLeavesCount = db.leaveRequests.filter(l => l.status === 'pending').length;
    const pendingPrefsCount = db.shiftPreferences.filter(p => p.status === 'pending').length;
    const pendingCount = pendingLeavesCount + pendingPrefsCount;

    return `
    <div class="p-4 space-y-4">
        <!-- 상단 요약 및 대기건 일괄 승인 배너 -->
        <div class="bg-white rounded-3xl p-4 border shadow-sm flex justify-between items-center">
            <div>
                <h2 class="font-bold text-sm text-slate-800">스케줄 신청 통합 확인 센터</h2>
                <p class="text-[11px] text-slate-500 mt-0.5">미결정 대기 요청 <b class="text-rose-600">${pendingCount}건</b> · 결정 시 기록 영구보존 및 잠금</p>
            </div>
            ${pendingCount > 0 ? `<button onclick="approveAllPendingRequests()" class="bg-indigo-600 text-white text-xs font-bold px-3.5 py-2 rounded-xl shadow-sm shrink-0">대기건 일괄승인</button>` : '<span class="text-xs font-bold text-emerald-600 bg-emerald-50 px-3 py-1.5 rounded-xl">모두 처리됨</span>'}
        </div>

        <!-- 3가지 뷰 전환 탭 (전체 목록 / 달력 일별 보기 / 사람별 신청현황) -->
        <div class="grid grid-cols-3 gap-1.5 bg-slate-200/80 p-1 rounded-2xl">
            <button onclick="setReqAdminViewMode('list')" class="py-2 rounded-xl text-xs font-bold transition ${state.reqAdminViewMode === 'list' ? 'bg-white text-indigo-600 shadow-sm' : 'text-slate-600'}">
                📋 전체목록
            </button>
            <button onclick="setReqAdminViewMode('calendar')" class="py-2 rounded-xl text-xs font-bold transition ${state.reqAdminViewMode === 'calendar' ? 'bg-white text-indigo-600 shadow-sm' : 'text-slate-600'}">
                📅 달력(일별)
            </button>
            <button onclick="setReqAdminViewMode('person')" class="py-2 rounded-xl text-xs font-bold transition ${state.reqAdminViewMode === 'person' ? 'bg-white text-indigo-600 shadow-sm' : 'text-slate-600'}">
                👤 사람별현황
            </button>
        </div>

        <!-- 선택된 뷰 렌더링 -->
        ${state.reqAdminViewMode === 'list' ? renderAdminReqListView() : (state.reqAdminViewMode === 'calendar' ? renderAdminReqCalendarView() : renderAdminReqPersonView())}
    </div>`;
}

function setReqAdminViewMode(mode) {
    state.reqAdminViewMode = mode;
    renderApp();
}

// 공통 개별 신청 아이템 카드 렌더링 (대기중일 때만 승인/반려 버튼 노출, 결정 완료 시 🔒확정 잠금 표시!)
function renderSingleRequestActionButtons(kind, item) {
    if (item.status === 'pending') {
        return `
        <div class="flex gap-1.5 shrink-0">
            <button onclick="updateRequestStatus('${kind}','${item.id}','approved')" class="px-3 py-1.5 rounded-xl text-xs font-bold bg-emerald-600 hover:bg-emerald-700 text-white shadow-sm">승인</button>
            <button onclick="updateRequestStatus('${kind}','${item.id}','rejected')" class="px-3 py-1.5 rounded-xl text-xs font-bold bg-rose-600 hover:bg-rose-700 text-white shadow-sm">반려</button>
        </div>`;
    }
    return `
    <div class="text-right shrink-0">
        <span class="inline-flex items-center gap-1 text-[10px] font-bold px-2 py-1 rounded-lg bg-slate-200/80 text-slate-600">
            <i class="fa-solid fa-lock text-[9px]"></i> 결정확정 (변경불가)
        </span>
    </div>`;
}

// [핵심 요구사항 2] 한 번 승인(approved) 또는 반려(rejected)로 결정된 기록은 다시 변경할 수 없도록 잠금!
function updateRequestStatus(kind, id, newStatus) {
    if (kind === 'leave') {
        const item = db.leaveRequests.find(r => r.id === id);
        if (!item) return;
        if (item.status !== 'pending') {
            return showToast('이미 승인/반려가 확정된 기록입니다. 직원이 새로 신청해야만 변경할 수 있습니다.', 'warning');
        }
        item.status = newStatus;
        item.decidedAt = new Date().toLocaleString('ko-KR');
        if (newStatus === 'approved' && db.schedules[item.date]) {
            Object.keys(db.schedules[item.date]).forEach(sid => {
                db.schedules[item.date][sid] = db.schedules[item.date][sid].filter(uid => uid !== item.userId);
            });
            db.hasUnpublishedChanges = true;
        }
    } else {
        const item = db.shiftPreferences.find(r => r.id === id);
        if (!item) return;
        if (item.status !== 'pending') {
            return showToast('이미 승인/반려가 확정된 기록입니다. 직원이 새로 신청해야만 변경할 수 있습니다.', 'warning');
        }
        item.status = newStatus;
        item.decidedAt = new Date().toLocaleString('ko-KR');
    }
    saveData();
    renderApp();
    showToast(`${newStatus === 'approved' ? '승인' : '반려'} 처리되어 확정(잠금)되었습니다.`, 'success');
}

function approveAllPendingRequests() {
    const nowStr = new Date().toLocaleString('ko-KR');
    db.leaveRequests.forEach(r => {
        if (r.status === 'pending') {
            r.status = 'approved';
            r.decidedAt = nowStr;
            if (db.schedules[r.date]) {
                Object.keys(db.schedules[r.date]).forEach(sid => {
                    db.schedules[r.date][sid] = db.schedules[r.date][sid].filter(uid => uid !== r.userId);
                });
                db.hasUnpublishedChanges = true;
            }
        }
    });
    db.shiftPreferences.forEach(sp => {
        if (sp.status === 'pending') {
            sp.status = 'approved';
            sp.decidedAt = nowStr;
        }
    });
    saveData();
    renderApp();
    showToast('대기 중인 모든 신청이 일괄 승인 확정되었습니다.', 'success');
}

/**
 * ==========================================
 * 9. 탭 4: 공평성 통계
 * ==========================================
 */
function renderFairnessStatsTab() {
    const isAdmin = isViewingAsAdmin();
    const activeSchedules = getActiveSchedules();
    const year = state.currentYear, month = state.currentMonth, daysInMonth = getDaysInMonth(year, month);
    const { overUserMap } = getOver52hViolations(year, month, isAdmin);

    const userMetrics = db.users.map(u => {
        const shiftMap = {}; db.shifts.forEach(s => shiftMap[s.id] = 0);
        let totalWorkDays = 0, totalWorkHours = 0, totalOt = 0;
        for (let d = 1; d <= daysInMonth; d++) {
            const dateStr = formatDate(year, month, d);
            db.shifts.forEach(s => {
                if ((activeSchedules[dateStr]?.[s.id] || []).includes(u.id)) {
                    shiftMap[s.id]++;
                    totalWorkDays++;
                }
            });
            totalWorkHours += getUserDailyTotalWorkHours(dateStr, u.id, isAdmin);
            totalOt += getUserDailyOt(dateStr, u.id, isAdmin);
        }
        return { user: u, totalWorkDays, totalWorkHours: round1(totalWorkHours), totalOt: round1(totalOt), shiftMap, overWeeks: overUserMap[u.id] || [] };
    });

    let trHtml = userMetrics.map(m => `
        <tr class="${m.overWeeks.length > 0 ? 'bg-rose-50/70' : ''}">
            <td class="py-2.5 px-2 font-bold text-slate-800 whitespace-nowrap">
                <div>${m.user.name}</div>
                ${m.overWeeks.length > 0 ? `<span class="text-[9px] font-extrabold px-1.5 py-0.2 rounded bg-rose-600 text-white">🚨${m.overWeeks.map(w => `${w.weekIdx}주(${w.hours}h)`).join(',')}</span>` : ''}
            </td>
            <td class="py-2.5 px-1.5 text-center font-bold text-indigo-600 whitespace-nowrap">${m.totalWorkDays}일<div class="text-[9px] font-normal text-slate-400">(${m.totalWorkHours}h)</div></td>
            <td class="py-2.5 px-1.5 text-center font-extrabold text-sky-600 whitespace-nowrap">${m.totalOt}h</td>
            ${db.shifts.map(s => `<td class="py-2.5 px-1 text-center text-slate-600">${m.shiftMap[s.id]}</td>`).join('')}
        </tr>
    `).join('');

    return `
    <div class="p-4 space-y-4">
        <div class="bg-white rounded-3xl p-4 border shadow-sm overflow-x-auto max-h-[70vh]">
            <h3 class="font-bold text-sm text-slate-800 mb-3">${year}년 ${month}월 근무일수 & OT·52h 통계 (총 ${db.users.length}명)</h3>
            <table class="w-full text-left text-xs border-collapse">
                <thead class="sticky top-0 bg-white z-10">
                    <tr class="border-b text-slate-400 text-[11px]">
                        <th class="py-2 px-2">이름</th>
                        <th class="py-2 px-1.5 text-center">총근무</th>
                        <th class="py-2 px-1.5 text-center text-sky-600">총OT</th>
                        ${db.shifts.map(s => `<th class="py-2 px-1 text-center">${s.name}</th>`).join('')}
                    </tr>
                </thead>
                <tbody class="divide-y">${trHtml}</tbody>
            </table>
        </div>
    </div>`;
}

/**
 * ==========================================
 * 10. 탭 5: 시프트(10가지 색상) 설정 & 직원 관리
 * ==========================================
 */
function renderSettingsTab() {
    let shiftsHtml = db.shifts.map(s => {
        const c = getShiftColor(s.colorId);
        const calc = calculateWorkAndOtFromTimeRange(s.time, false);
        const wOt = getShiftOtHoursForDate(s, null);
        return `
        <div class="p-3.5 border rounded-2xl flex justify-between items-center bg-slate-50/70">
            <div class="flex gap-3 items-center">
                <span style="background:${c.bg}; color:${c.text}; border:1px solid ${c.border}" class="px-2.5 py-1 rounded-xl font-bold text-xs">${s.name}</span>
                <div>
                    <div class="text-xs font-bold text-slate-800">${s.time} <span class="text-[11px] font-normal text-slate-500">(필수 ${s.reqCount}명)</span></div>
                    <div class="text-[10px] text-slate-500">평일 OT: <b>${wOt}h</b> · 주말/공휴일 OT: <b class="text-rose-600">${calc.holidayOt}h(전시간)</b></div>
                </div>
            </div>
            <div class="flex gap-1">
                <button onclick="openShiftEditorModal('${s.id}')" class="w-8 h-8 bg-white border rounded-xl text-xs"><i class="fa-solid fa-pen"></i></button>
                <button onclick="deleteShift('${s.id}')" class="w-8 h-8 bg-rose-50 text-rose-600 border border-rose-100 rounded-xl text-xs"><i class="fa-solid fa-trash"></i></button>
            </div>
        </div>`;
    }).join('');

    let usersHtml = db.users.map(u => {
        const fixedS = u.fixedShiftId ? getShiftById(u.fixedShiftId) : null;
        return `
        <div class="p-3 border rounded-2xl flex justify-between items-center bg-slate-50/70">
            <div class="flex gap-3 items-center">
                <span class="w-8 h-8 rounded-xl ${u.avatarColor} text-white flex justify-center items-center text-xs font-bold">${u.name.charAt(0)}</span>
                <div>
                    <div class="text-xs font-bold">${u.name} <span class="text-indigo-600 font-normal">(${u.role})</span></div>
                    <div class="text-[10px] ${fixedS ? 'text-pink-600 font-bold' : 'text-slate-400'}">
                        ${fixedS ? `📌 고정 근무시간: ${fixedS.name} (${fixedS.time})` : `전 시프트 순환 가능 · PIN ${u.pin}`}
                    </div>
                </div>
            </div>
            <div class="flex gap-1">
                <button onclick="openWorkerEditorModal('${u.id}')" class="w-8 h-8 bg-white border rounded-xl text-xs"><i class="fa-solid fa-pen"></i></button>
                <button onclick="deleteWorker('${u.id}')" class="w-8 h-8 bg-rose-50 text-rose-600 border border-rose-100 rounded-xl text-xs"><i class="fa-solid fa-trash"></i></button>
            </div>
        </div>`;
    }).join('');

    return `
    <div class="p-4 space-y-5">
        <div class="bg-white rounded-3xl p-4 border shadow-sm space-y-3">
            <div class="flex justify-between items-center">
                <div>
                    <h3 class="font-bold text-sm">⏰ 근무시간(시프트) & 10가지 색상 설정</h3>
                    <p class="text-[11px] text-slate-400">평일 연장 OT 및 휴일 전시간 OT가 자동 계산됩니다.</p>
                </div>
                <button onclick="openShiftEditorModal()" class="bg-indigo-600 text-white text-xs font-bold px-3 py-2 rounded-xl shrink-0">+ 시프트 추가</button>
            </div>
            <div class="space-y-2">${shiftsHtml}</div>
        </div>

        <div class="bg-white rounded-3xl p-4 border shadow-sm space-y-3">
            <div class="flex justify-between items-center">
                <div>
                    <h3 class="font-bold text-sm">👥 직원 및 파트타임 관리 (총 ${db.users.length}명)</h3>
                    <p class="text-[11px] text-slate-400">파트타임은 정해진 시프트로만 근무하도록 고정할 수 있습니다.</p>
                </div>
                <button onclick="openWorkerEditorModal()" class="bg-emerald-600 text-white text-xs font-bold px-3 py-2 rounded-xl shrink-0">+ 직원 추가</button>
            </div>
            <div class="space-y-2 max-h-[50vh] overflow-y-auto pr-1">${usersHtml}</div>
        </div>
    </div>`;
}

function openShiftEditorModal(shiftId = null) {
    const t = shiftId ? getShiftById(shiftId) : { name: '', time: '07:00~18:30', reqCount: 1, colorId: 'sky', otHours: 2 };
    const initCalc = calculateWorkAndOtFromTimeRange(t.time, false);
    const currentOt = t.otHours !== undefined ? t.otHours : initCalc.weekdayOt;

    let colorSwatchesHtml = COLOR_PRESETS.map(c => `
        <button type="button" onclick="selectShiftColorPreset('${c.id}')" id="swatch-${c.id}" style="background:${c.bg}; color:${c.text}; border:2px solid ${t.colorId === c.id ? c.text : c.border}" class="py-1.5 px-2 rounded-xl text-[10px] font-bold flex items-center justify-center gap-1 transition">
            <span style="background:${c.bar}" class="w-2 h-2 rounded-full"></span>
            <span>${c.name.split(' ')[1]}</span>
        </button>
    `).join('');

    let html = `
        <div class="space-y-3.5">
            <div>
                <label class="block text-xs font-bold text-slate-600 mb-1">시프트 명칭</label>
                <input id="modal-shift-name" type="text" value="${t.name}" placeholder="예: 조출OT, 파트전용 등" class="w-full border rounded-xl px-3 py-2.5 text-xs bg-slate-50">
            </div>
            <div class="grid grid-cols-2 gap-2">
                <div>
                    <label class="block text-xs font-bold text-slate-600 mb-1">근무 시간대 (HH:MM~HH:MM)</label>
                    <input id="modal-shift-time" type="text" value="${t.time}" oninput="onShiftTimeInputChanged()" placeholder="07:00~18:30" class="w-full border rounded-xl px-3 py-2.5 text-xs bg-slate-50 font-semibold">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-600 mb-1">일일 필수 인원</label>
                    <input id="modal-shift-req" type="number" min="1" max="100" value="${t.reqCount}" class="w-full border rounded-xl px-3 py-2.5 text-xs bg-slate-50">
                </div>
            </div>

            <div class="bg-sky-50 border border-sky-200 rounded-2xl p-3 space-y-2">
                <div class="flex items-center justify-between">
                    <span class="text-xs font-bold text-sky-900">⏱️ 평일 인정 OT (휴일엔 ${initCalc.holidayOt}h 전시간 OT)</span>
                    <button type="button" onclick="onShiftTimeInputChanged()" class="text-[10px] font-bold bg-white border border-sky-300 text-sky-700 px-2 py-0.5 rounded-lg">자동재계산</button>
                </div>
                <div class="flex items-center gap-2">
                    <input id="modal-shift-ot" type="number" step="0.5" min="0" max="15" value="${currentOt}" class="w-24 bg-white border border-sky-300 rounded-xl px-3 py-2 text-sm font-extrabold text-sky-700 text-center">
                    <span class="text-xs font-bold text-slate-700">시간</span>
                    <span id="modal-ot-calc-desc" class="text-[11px] text-slate-500 ml-auto">
                        실근무 ${initCalc.netWorkHours}h / 휴게 ${initCalc.breakHours}h
                    </span>
                </div>
            </div>

            <div>
                <label class="block text-xs font-bold text-slate-600 mb-1.5">배지 컬러 테마 (10가지 색상 중 선택)</label>
                <input type="hidden" id="modal-shift-color" value="${t.colorId || 'amber'}">
                <div class="grid grid-cols-5 gap-1.5">
                    ${colorSwatchesHtml}
                </div>
            </div>
            <button onclick="saveShiftForm('${shiftId || ''}')" class="w-full py-3.5 rounded-2xl bg-indigo-600 text-white font-bold text-xs shadow-md">저장하기</button>
        </div>
    `;
    openModal(shiftId ? '시프트 수정' : '새 시프트 추가', '', html);
}

function selectShiftColorPreset(colorId) {
    const input = document.getElementById('modal-shift-color');
    if (input) input.value = colorId;
    COLOR_PRESETS.forEach(c => {
        const btn = document.getElementById(`swatch-${c.id}`);
        if (btn) {
            btn.style.borderColor = (c.id === colorId) ? c.text : c.border;
            btn.style.transform = (c.id === colorId) ? 'scale(1.05)' : 'scale(1)';
        }
    });
}

function onShiftTimeInputChanged() {
    const timeVal = document.getElementById('modal-shift-time')?.value || '';
    const calc = calculateWorkAndOtFromTimeRange(timeVal, false);
    const otInput = document.getElementById('modal-shift-ot');
    const descEl = document.getElementById('modal-ot-calc-desc');
    if (otInput) otInput.value = calc.weekdayOt;
    if (descEl) descEl.textContent = `실근무 ${calc.netWorkHours}h / 휴게 ${calc.breakHours}h (휴일OT ${calc.holidayOt}h)`;
}

function saveShiftForm(shiftId) {
    const name = document.getElementById('modal-shift-name').value.trim();
    const time = document.getElementById('modal-shift-time').value.trim();
    const reqCount = parseInt(document.getElementById('modal-shift-req').value, 10) || 1;
    const otHours = parseFloat(document.getElementById('modal-shift-ot').value) || 0;
    const colorId = document.getElementById('modal-shift-color').value || 'amber';
    if (!name || !time) return showToast('명칭과 시간대를 입력해주세요.', 'warning');

    if (shiftId) {
        const s = getShiftById(shiftId);
        if (s) { s.name = name; s.time = time; s.reqCount = reqCount; s.otHours = round1(otHours); s.colorId = colorId; }
    } else {
        db.shifts.push({ id: 's_' + Date.now(), name, code: name, time, reqCount, otHours: round1(otHours), colorId });
    }
    saveData(); closeModal(); renderApp();
}

function deleteShift(shiftId) {
    if (db.shifts.length <= 1) return showToast('최소 1개 이상의 시프트가 필요합니다.', 'warning');
    db.shifts = db.shifts.filter(s => s.id !== shiftId);
    saveData(); renderApp();
}

function openWorkerEditorModal(userId = null) {
    const t = userId ? getUserById(userId) : { name: '', role: '스태프', totalLeave: 15, pin: '0000', fixedShiftId: '' };
    let html = `
        <div class="space-y-3.5">
            <div class="grid grid-cols-2 gap-2">
                <div>
                    <label class="block text-xs font-bold text-slate-600 mb-1">직원 이름</label>
                    <input id="modal-user-name" type="text" value="${t.name}" placeholder="이름" class="w-full border rounded-xl px-3 py-2 text-xs bg-slate-50">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-600 mb-1">직급 / 구분</label>
                    <input id="modal-user-role" type="text" value="${t.role}" placeholder="예: 파트타임, 스태프" class="w-full border rounded-xl px-3 py-2 text-xs bg-slate-50">
                </div>
            </div>
            <div>
                <label class="block text-xs font-bold text-pink-700 mb-1">📌 파트타임/전담 고정 근무시간 지정</label>
                <select id="modal-user-fixed-shift" class="w-full border border-pink-200 rounded-xl px-3 py-2.5 text-xs bg-pink-50/50 font-semibold text-slate-800">
                    <option value="" ${!t.fixedShiftId ? 'selected' : ''}>제한 없음 (모든 일반 시프트 순환 배정)</option>
                    ${db.shifts.map(s => `<option value="${s.id}" ${t.fixedShiftId === s.id ? 'selected' : ''}>[${s.name}] ${s.time} 으로만 고정 배정</option>`).join('')}
                </select>
            </div>
            <div class="grid grid-cols-2 gap-2">
                <div>
                    <label class="block text-xs font-bold text-slate-600 mb-1">연간 기본 연차</label>
                    <input id="modal-user-leave" type="number" value="${t.totalLeave}" class="w-full border rounded-xl px-3 py-2 text-xs bg-slate-50">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-600 mb-1">본인 로그인 PIN (4자리)</label>
                    <input id="modal-user-pin" type="text" maxlength="4" value="${t.pin}" class="w-full border rounded-xl px-3 py-2 text-xs bg-slate-50">
                </div>
            </div>
            <button onclick="saveWorkerForm('${userId || ''}')" class="w-full py-3.5 rounded-2xl bg-emerald-600 text-white font-bold text-xs shadow-md">직원 정보 저장</button>
        </div>
    `;
    openModal(userId ? '직원 및 고정 근무시간 수정' : '새 직원 추가', '', html);
}

function saveWorkerForm(userId) {
    const name = document.getElementById('modal-user-name').value.trim();
    const role = document.getElementById('modal-user-role').value.trim() || '스태프';
    const fixedShiftId = document.getElementById('modal-user-fixed-shift').value;
    const totalLeave = parseInt(document.getElementById('modal-user-leave').value, 10) || 15;
    const pin = document.getElementById('modal-user-pin').value.trim() || '0000';
    if (!name) return showToast('이름을 입력해주세요.', 'warning');

    const cols = ['bg-blue-600', 'bg-emerald-600', 'bg-amber-600', 'bg-purple-600', 'bg-rose-600', 'bg-teal-600', 'bg-indigo-600', 'bg-orange-600'];
    if (userId) {
        const u = getUserById(userId);
        if (u) { u.name = name; u.role = role; u.fixedShiftId = fixedShiftId; u.totalLeave = totalLeave; u.pin = pin; }
    } else {
        db.users.push({ id: 'u_' + Date.now(), name, role, fixedShiftId, totalLeave, pin, avatarColor: cols[db.users.length % cols.length] });
    }
    saveData(); closeModal(); renderApp();
    showToast('직원 설정이 저장되었습니다.', 'success');
}

function deleteWorker(userId) {
    if (db.users.length <= 1) return;
    db.users = db.users.filter(u => u.id !== userId);
    saveData(); renderApp();
}

function openModal(title, subtitle, bodyHtml) {
    document.getElementById('modal-title').textContent = title;
    const subEl = document.getElementById('modal-subtitle');
    if (subtitle) { subEl.textContent = subtitle; subEl.classList.remove('hidden'); } else subEl.classList.add('hidden');
    document.getElementById('modal-body').innerHTML = bodyHtml;
    document.getElementById('modal-overlay').classList.remove('hidden');
}
function closeModal() { document.getElementById('modal-overlay').classList.add('hidden'); }
function handleBackdropClick(e) { if (e.target.id === 'modal-overlay') closeModal(); }

window.onload = function() {
    initCloudData();
};
</script>
