function formatDate(year, month, day) {
    return `${year}-${String(month).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
}

function round1(val) {
    return Math.round(val * 10) / 10;
}

function getOffsetDateStr(dateStr, offsetDays) {
    const [y, m, d] = dateStr.split('-').map(Number);
    const dt = new Date(y, m - 1, d + offsetDays);
    return formatDate(dt.getFullYear(), dt.getMonth() + 1, dt.getDate());
}

/**
 * ==========================================
 * 1. 평일 & 휴일(주말/공휴일) 실근로시간 및 OT 산출 엔진
 * ==========================================
 */
function calculateWorkAndOtFromTimeRange(timeStr, isHolidayOrWeekend = false) {
    if (!timeStr || !timeStr.includes('~')) return { stayHours: 0, netWorkHours: 0, breakHours: 0, weekdayOt: 0, holidayOt: 0 };
    const parts = timeStr.split('~').map(s => s.trim());
    const startMatch = parts[0].match(/^(\d{1,2}):(\d{2})$/);
    const endMatch = parts[1].match(/^(\d{1,2}):(\d{2})$/);
    if (!startMatch || !endMatch) return { stayHours: 0, netWorkHours: 0, breakHours: 0, weekdayOt: 0, holidayOt: 0 };

    const startMin = parseInt(startMatch[1], 10) * 60 + parseInt(startMatch[2], 10);
    let endMin = parseInt(endMatch[1], 10) * 60 + parseInt(endMatch[2], 10);
    if (endMin <= startMin) endMin += 24 * 60;

    const stayHours = (endMin - startMin) / 60;

    let netWork = 0;
    let breakTime = 0;
    if (stayHours <= 9) {
        if (stayHours <= 4.0) { netWork = stayHours; breakTime = 0; }
        else if (stayHours <= 4.5) { netWork = 4.0; breakTime = stayHours - 4.0; }
        else if (stayHours <= 8.5) { netWork = stayHours - 0.5; breakTime = 0.5; }
        else { netWork = 8.0; breakTime = stayHours - 8.0; }
    } else {
        const extraStay = stayHours - 9;
        let extraOt = 0, extraBrk = 0;
        if (extraStay <= 2.0) { extraOt = extraStay; extraBrk = 0; }
        else if (extraStay <= 2.5) { extraOt = 2.0; extraBrk = extraStay - 2.0; }
        else {
            const afterFirst = extraStay - 2.5;
            const blocks = Math.floor(afterFirst / 4.5);
            const rem = afterFirst % 4.5;
            const remOt = rem <= 4.0 ? rem : 4.0;
            const remBrk = rem <= 4.0 ? 0 : rem - 4.0;
            extraOt = 2.0 + (blocks * 4.0) + remOt;
            extraBrk = 0.5 + (blocks * 0.5) + remBrk;
        }
        netWork = 8.0 + extraOt;
        breakTime = 1.0 + extraBrk;
    }

    const weekdayOt = Math.max(0, round1(netWork - 8.0));

    return {
        stayHours: round1(stayHours),
        netWorkHours: round1(netWork),
        breakHours: round1(breakTime),
        weekdayOt: round1(weekdayOt),
        holidayOt: round1(netWork),
        otHours: isHolidayOrWeekend ? round1(netWork) : round1(weekdayOt)
    };
}

function isWeekendOrHoliday(dateStr) {
    const [y, m, d] = dateStr.split('-').map(Number);
    const dayOfWeek = new Date(y, m - 1, d).getDay();
    if (dayOfWeek === 0 || dayOfWeek === 6) return true;
    const holidays = db.holidays || DEFAULT_KR_HOLIDAYS;
    return holidays.includes(dateStr);
}

function getHolidayBadgeLabel(dateStr) {
    const holidays = db.holidays || DEFAULT_KR_HOLIDAYS;
    if (holidays.includes(dateStr)) return '공휴일';
    const [y, m, d] = dateStr.split('-').map(Number);
    const dow = new Date(y, m - 1, d).getDay();
    if (dow === 0) return '일요일';
    if (dow === 6) return '토요일';
    return null;
}

function getShiftOtHoursForDate(shift, dateStr) {
    if (!shift) return 0;
    const isHol = dateStr ? isWeekendOrHoliday(dateStr) : false;
    const calc = calculateWorkAndOtFromTimeRange(shift.time, isHol);
    if (isHol) return calc.holidayOt;
    if (shift.otHours !== undefined && shift.otHours !== null && shift.otHours !== '') {
        return Number(shift.otHours) || 0;
    }
    return calc.weekdayOt;
}

function getShiftTotalWorkHoursForDate(shift, dateStr) {
    if (!shift) return 0;
    const isHol = dateStr ? isWeekendOrHoliday(dateStr) : false;
    const calc = calculateWorkAndOtFromTimeRange(shift.time, isHol);
    if (isHol) return calc.holidayOt;
    const baseRegular = Math.min(8, calc.netWorkHours);
    const ot = getShiftOtHoursForDate(shift, dateStr);
    return round1(baseRegular + ot);
}

// 이전 달 말일 ~ 다음 달 초일이 모두 포함된 연속 7일 주간 배열 생성기
function getMonthCalendarWeeks(year, month) {
    const firstDayOfMonth = new Date(year, month - 1, 1);
    const lastDayOfMonth = new Date(year, month, 0);

    const startDate = new Date(firstDayOfMonth);
    startDate.setDate(firstDayOfMonth.getDate() - firstDayOfMonth.getDay());

    const endDate = new Date(lastDayOfMonth);
    endDate.setDate(lastDayOfMonth.getDate() + (6 - lastDayOfMonth.getDay()));

    const weeks = [];
    let cur = new Date(startDate);
    while (cur <= endDate) {
        const week = [];
        for (let i = 0; i < 7; i++) {
            const y = cur.getFullYear();
            const m = cur.getMonth() + 1;
            const d = cur.getDate();
            week.push({
                year: y,
                month: m,
                day: d,
                dateStr: formatDate(y, m, d),
                isCurrentMonth: (y === year && m === month),
                dowIndex: i
            });
            cur.setDate(cur.getDate() + 1);
        }
        weeks.push(week);
    }
    return weeks;
}

async function initCloudData() {
    showLoading('구글 시트에서 최신 데이터를 불러오는 중...');
    let loadedFromCloud = false;

    if (SCRIPT_URL && SCRIPT_URL.startsWith('http')) {
        try {
            const response = await fetch(SCRIPT_URL);
            const data = await response.json();
            if (data && data.users && data.shifts) {
                db = data;
                loadedFromCloud = true;
            }
        } catch (e) {
            console.error('Cloud load failed:', e);
            showToast('서버 연결 실패. 로컬 백업 모드로 실행합니다.', 'warning');
        }
    }

    if (!loadedFromCloud) {
        try {
            const raw = localStorage.getItem(STORAGE_KEY);
            if (raw) {
                const parsed = JSON.parse(raw);
                if (parsed && parsed.users) db = parsed;
            }
        } catch(err) { console.error('Local data error:', err); }
    }

    if (!db || !db.users) db = createInitialData();
    if (!db.schedules) db.schedules = {};
    if (!db.holidays) db.holidays = [...DEFAULT_KR_HOLIDAYS];
    if (!db.leaveRequests) db.leaveRequests = [];
    if (!db.shiftPreferences) db.shiftPreferences = [];
    if (!db.holidayUnavailables) db.holidayUnavailables = [];
    if (!db.extraOtLogs) db.extraOtLogs = {};

    db.users.forEach(u => {
        if (u.fixedShiftId === undefined) {
            if (u.role && u.role.includes('파트')) {
                const partShift = db.shifts.find(s => s.name.includes('파트')) || db.shifts[0];
                u.fixedShiftId = partShift ? partShift.id : '';
            } else {
                u.fixedShiftId = '';
            }
        }
    });

    if (!db.publishedSchedules || Object.keys(db.publishedSchedules).length === 0) {
        db.publishedSchedules = JSON.parse(JSON.stringify(db.schedules));
    }
    if (!db.publishedExtraOtLogs) {
        db.publishedExtraOtLogs = JSON.parse(JSON.stringify(db.extraOtLogs));
    }

    hideLoading();
    ensureInitialSchedule();
    renderApp();
}

async function saveDataToCloud(showSpinner = true) {
    if (showSpinner) showLoading('구글 시트에 저장 중...');
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(db)); } catch(e) {}

    if (SCRIPT_URL && SCRIPT_URL.startsWith('http')) {
        try {
            await fetch(SCRIPT_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify(db)
            });
        } catch (e) {
            console.error('Cloud save failed:', e);
            showToast('서버 저장 실패. 기기에만 임시 저장되었습니다.', 'error');
        }
    }
    if (showSpinner) hideLoading();
}

function saveData() { saveDataToCloud(true); }
function markScheduleDirty() { db.hasUnpublishedChanges = true; saveData(); }

function publishScheduleNow() {
    db.publishedSchedules = JSON.parse(JSON.stringify(db.schedules || {}));
    db.publishedExtraOtLogs = JSON.parse(JSON.stringify(db.extraOtLogs || {}));
    db.hasUnpublishedChanges = false;
    db.lastPublishedAt = new Date().toLocaleString('ko-KR');
    saveData();
    closeModal();
    renderApp();
    showToast('📢 스케줄이 공식 배포되어 모든 근무자에게 공유되었습니다!', 'success');
}

function ensureInitialSchedule() {
    const weeks = getMonthCalendarWeeks(CURRENT_YEAR, CURRENT_MONTH);
    let changed = false;
    weeks.forEach((w, idx) => {
        const hasAny = w.some(cell => db.schedules[cell.dateStr] && Object.keys(db.schedules[cell.dateStr]).length > 0);
        if (!hasAny) {
            runWeeklySmartAutoSchedule(CURRENT_YEAR, CURRENT_MONTH, idx, true, true, true);
            changed = true;
        }
    });
    if (changed) {
        db.publishedSchedules = JSON.parse(JSON.stringify(db.schedules));
        db.hasUnpublishedChanges = false;
        db.lastPublishedAt = new Date().toLocaleString('ko-KR');
    }
}

function showToast(message, type = 'info') {
    const container = document.getElementById('toast-container');
    const toast = document.createElement('div');
    const bgMap = { success: 'bg-emerald-600 text-white', error: 'bg-rose-600 text-white', warning: 'bg-amber-500 text-white', info: 'bg-slate-800 text-white' };
    const iconMap = { success: 'fa-circle-check', error: 'fa-circle-exclamation', warning: 'fa-triangle-exclamation', info: 'fa-bell' };
    toast.className = `toast-enter ${bgMap[type] || bgMap.info} px-4 py-3 rounded-2xl shadow-lg flex items-center gap-2.5 text-xs font-medium pointer-events-auto`;
    toast.innerHTML = `<i class="fa-solid ${iconMap[type] || iconMap.info} text-sm shrink-0"></i><span class="flex-1 leading-snug">${message}</span>`;
    container.appendChild(toast);
    setTimeout(() => { toast.style.opacity = '0'; toast.style.transition = 'opacity 0.25s ease'; setTimeout(() => toast.remove(), 250); }, 2600);
}

function getShiftColor(colorId) { return COLOR_PRESETS.find(c => c.id === colorId) || COLOR_PRESETS[0]; }
function getUserById(userId) { return db.users.find(u => u.id === userId); }
function getShiftById(shiftId) { return db.shifts.find(s => s.id === shiftId); }
function getDaysInMonth(year, month) { return new Date(year, month, 0).getDate(); }
function getDayOfWeekName(dateStr) {
    const [y, m, d] = dateStr.split('-').map(Number);
    return ['일', '월', '화', '수', '목', '금', '토'][new Date(y, m - 1, d).getDay()];
}

function getUserDailyOt(dateStr, userId, useDraft = isViewingAsAdmin()) {
    const schedSource = useDraft ? (db.schedules || {}) : (db.publishedSchedules || {});
    const extraSource = useDraft ? (db.extraOtLogs || {}) : (db.publishedExtraOtLogs || {});
    const daySched = schedSource[dateStr] || {};
    let shiftOt = 0;
    db.shifts.forEach(s => {
        if ((daySched[s.id] || []).includes(userId)) {
            shiftOt += getShiftOtHoursForDate(s, dateStr);
        }
    });
    const extraOt = Number(extraSource?.[dateStr]?.[userId]) || 0;
    return round1(shiftOt + extraOt);
}

function getUserDailyTotalWorkHours(dateStr, userId, useDraft = isViewingAsAdmin()) {
    const schedSource = useDraft ? (db.schedules || {}) : (db.publishedSchedules || {});
    const extraSource = useDraft ? (db.extraOtLogs || {}) : (db.publishedExtraOtLogs || {});
    const daySched = schedSource[dateStr] || {};
    let workHours = 0;
    db.shifts.forEach(s => {
        if ((daySched[s.id] || []).includes(userId)) {
            workHours += getShiftTotalWorkHoursForDate(s, dateStr);
        }
    });
    const extraOt = Number(extraSource?.[dateStr]?.[userId]) || 0;
    return round1(Math.max(0, workHours + extraOt));
}

function getUserWeeklyWorkHoursByDateStr(dateStr, userId, useDraft = isViewingAsAdmin()) {
    const [y, m, d] = dateStr.split('-').map(Number);
    const dt = new Date(y, m - 1, d);
    const sunday = new Date(dt);
    sunday.setDate(dt.getDate() - dt.getDay());

    let sum = 0;
    for (let i = 0; i < 7; i++) {
        const cur = new Date(sunday);
        cur.setDate(sunday.getDate() + i);
        const curStr = formatDate(cur.getFullYear(), cur.getMonth() + 1, cur.getDate());
        sum += getUserDailyTotalWorkHours(curStr, userId, useDraft);
    }
    return round1(sum);
}

function getOver52hViolations(year, month, useDraft = isViewingAsAdmin()) {
    const weeks = getMonthCalendarWeeks(year, month);
    const violations = [];
    const overUserMap = {};

    db.users.forEach(u => {
        weeks.forEach((w, wIdx) => {
            let wHours = 0;
            w.forEach(cell => {
                wHours += getUserDailyTotalWorkHours(cell.dateStr, u.id, useDraft);
            });
            wHours = round1(wHours);
            if (wHours >= MAX_WEEKLY_WORK_HOURS) {
                const f = w[0];
                const l = w[6];
                violations.push({
                    user: u,
                    weekIdx: wIdx + 1,
                    totalHours: wHours,
                    weekDaysStr: `${f.month}/${f.day}~${l.month}/${l.day}`
                });
                if (!overUserMap[u.id]) overUserMap[u.id] = [];
                overUserMap[u.id].push({ weekIdx: wIdx + 1, hours: wHours });
            }
        });
    });

    return { violations, overUserMap };
}

function isUserHolidayUnavailable(userId, dateStr) {
    return (db.holidayUnavailables || []).some(item => item.userId === userId && item.date === dateStr);
}

function canUserWorkShift(user, shiftId) {
    if (!user) return false;
    if (user.fixedShiftId && user.fixedShiftId !== '') {
        return user.fixedShiftId === shiftId;
    }
    const isPartExclusiveShift = db.users.some(u => u.fixedShiftId === shiftId);
    if (isPartExclusiveShift) return false;
    return true;
}

/**
 * ==========================================
 * 2. 주간(Week) 단위 스마트 자동 스케줄링 엔진
 * ==========================================
 */
function runWeeklySmartAutoSchedule(year, month, weekIndex, silent = false, includePendingPrefs = true, preserveWeekendAssignments = true) {
    const weeks = getMonthCalendarWeeks(year, month);
    const targetWeek = weeks[weekIndex];
    if (!targetWeek) return;

    const userIds = db.users.map(u => u.id);
    if (userIds.length === 0 || db.shifts.length === 0) return silent || showToast('근무자 또는 시프트 설정이 비어있습니다.', 'error');

    const targetDateSet = new Set(targetWeek.map(c => c.dateStr));
    const monthPrefix = `${year}-${String(month).padStart(2, '0')}`;

    const stats = {};
    userIds.forEach(uid => {
        stats[uid] = { totalWorked: 0, totalOt: 0, shiftCounts: {}, prefGranted: 0, consecutiveDays: 0 };
        db.shifts.forEach(s => stats[uid].shiftCounts[s.id] = 0);
    });

    Object.keys(db.schedules || {}).forEach(dStr => {
        if (dStr.startsWith(monthPrefix) && !targetDateSet.has(dStr)) {
            const daySched = db.schedules[dStr] || {};
            db.shifts.forEach(s => {
                const sOt = getShiftOtHoursForDate(s, dStr);
                (daySched[s.id] || []).forEach(uid => {
                    if (stats[uid]) {
                        stats[uid].totalWorked++;
                        stats[uid].totalOt += sOt;
                        stats[uid].shiftCounts[s.id] = (stats[uid].shiftCounts[s.id] || 0) + 1;
                    }
                });
            });
        }
    });

    const firstDateStr = targetWeek[0].dateStr;
    userIds.forEach(uid => {
        let streak = 0;
        for (let back = 1; back <= 6; back++) {
            const prevStr = getOffsetDateStr(firstDateStr, -back);
            const prevSched = db.schedules[prevStr] || {};
            const workedPrev = Object.values(prevSched).some(arr => arr.includes(uid));
            if (workedPrev) streak++;
            else break;
        }
        stats[uid].consecutiveDays = streak;
    });

    const weekWorkMap = {};
    userIds.forEach(uid => weekWorkMap[uid] = 0);

    // [1단계] 주말 및 공휴일 선배정 스캔
    targetWeek.forEach(cell => {
        const dateStr = cell.dateStr;
        if (isWeekendOrHoliday(dateStr)) {
            if (preserveWeekendAssignments && db.schedules[dateStr]) {
                const onLeaveToday = new Set(db.leaveRequests.filter(lr => lr.date === dateStr && lr.status === 'approved').map(lr => lr.userId));
                db.shifts.forEach(shift => {
                    const existingArr = db.schedules[dateStr][shift.id] || [];
                    const validArr = existingArr.filter(uid => !onLeaveToday.has(uid) && !isUserHolidayUnavailable(uid, dateStr));
                    db.schedules[dateStr][shift.id] = validArr;

                    const sWork = getShiftTotalWorkHoursForDate(shift, dateStr);
                    const sOt = getShiftOtHoursForDate(shift, dateStr);
                    validArr.forEach(uid => {
                        if (stats[uid]) {
                            stats[uid].totalWorked++;
                            stats[uid].totalOt += sOt;
                            stats[uid].shiftCounts[shift.id]++;
                            weekWorkMap[uid] = round1(weekWorkMap[uid] + sWork);
                        }
                    });
                });
            } else {
                db.schedules[dateStr] = {};
                db.shifts.forEach(shift => db.schedules[dateStr][shift.id] = []);
            }
            userIds.forEach(uid => {
                const ext = Number(db.extraOtLogs?.[dateStr]?.[uid]) || 0;
                if (ext > 0) weekWorkMap[uid] = round1(weekWorkMap[uid] + ext);
            });
        }
    });

    const impossibleSlots = [];

    // [2단계] 평일 스케줄 자동 배정 (주 52시간 이내)
    targetWeek.forEach((cell, dIdx) => {
        const dateStr = cell.dateStr;

        if (isWeekendOrHoliday(dateStr)) {
            const workedWeekend = new Set();
            Object.values(db.schedules[dateStr] || {}).forEach(arr => arr.forEach(uid => workedWeekend.add(uid)));
            userIds.forEach(uid => {
                if (workedWeekend.has(uid)) stats[uid].consecutiveDays++;
                else stats[uid].consecutiveDays = 0;
            });
            return;
        }

        db.schedules[dateStr] = {};
        const assignedToday = new Set();
        const onLeaveToday = new Set(db.leaveRequests.filter(lr => lr.date === dateStr && lr.status === 'approved').map(lr => lr.userId));

        userIds.forEach(uid => {
            const ext = Number(db.extraOtLogs?.[dateStr]?.[uid]) || 0;
            if (ext > 0) weekWorkMap[uid] = round1(weekWorkMap[uid] + ext);
        });

        db.shifts.forEach(shift => {
            const reqCount = Number(shift.reqCount) || 1;
            const shiftOt = getShiftOtHoursForDate(shift, dateStr);
            const shiftWorkHours = getShiftTotalWorkHoursForDate(shift, dateStr);
            const assignedForShift = [];

            const isWithin52Hours = (uid) => {
                return round1(weekWorkMap[uid] + shiftWorkHours) <= MAX_WEEKLY_WORK_HOURS;
            };

            const prefCandidates = db.shiftPreferences.filter(sp => {
                const statusOk = includePendingPrefs ? (sp.status === 'approved' || sp.status === 'pending') : (sp.status === 'approved');
                return sp.date === dateStr && sp.shiftId === shift.id && statusOk;
            }).map(sp => sp.userId).filter(uid => {
                const u = getUserById(uid);
                return !onLeaveToday.has(uid) && !assignedToday.has(uid) && stats[uid] && canUserWorkShift(u, shift.id) && isWithin52Hours(uid);
            });

            // 중복 신청자가 있을 경우 고유 ID만 추출
            const uniquePrefCandidates = [...new Set(prefCandidates)];

            uniquePrefCandidates.sort((a, b) => stats[a].prefGranted !== stats[b].prefGranted ? stats[a].prefGranted - stats[b].prefGranted : stats[a].totalWorked - stats[b].totalWorked);
            for (const uid of uniquePrefCandidates) {
                if (assignedForShift.length < reqCount) {
                    assignedForShift.push(uid); assignedToday.add(uid);
                    stats[uid].totalWorked++; stats[uid].totalOt += shiftOt; stats[uid].shiftCounts[shift.id]++; stats[uid].prefGranted++;
                    weekWorkMap[uid] = round1(weekWorkMap[uid] + shiftWorkHours);
                }
            }

            while (assignedForShift.length < reqCount) {
                const availableUsers = userIds.filter(uid => {
                    const u = getUserById(uid);
                    return !onLeaveToday.has(uid) && !assignedToday.has(uid) && canUserWorkShift(u, shift.id) && isWithin52Hours(uid);
                });
                if (availableUsers.length === 0) break;

                availableUsers.sort((a, b) => calculateFairnessScore(stats[a], shift, dateStr, dIdx + availableUsers.indexOf(a)) - calculateFairnessScore(stats[b], shift, dateStr, dIdx + availableUsers.indexOf(b)));
                const chosenUid = availableUsers[0];
                assignedForShift.push(chosenUid); assignedToday.add(chosenUid);
                stats[chosenUid].totalWorked++; stats[chosenUid].totalOt += shiftOt; stats[chosenUid].shiftCounts[shift.id]++;
                weekWorkMap[chosenUid] = round1(weekWorkMap[chosenUid] + shiftWorkHours);
            }

            db.schedules[dateStr][shift.id] = assignedForShift;

            if (assignedForShift.length < reqCount) {
                const blockedBy52h = userIds.filter(uid => {
                    const u = getUserById(uid);
                    return !onLeaveToday.has(uid) && !assignedToday.has(uid) && canUserWorkShift(u, shift.id) && !isWithin52Hours(uid);
                }).map(uid => `${getUserById(uid)?.name}(주 ${weekWorkMap[uid]}h)`);

                const leaveNames = Array.from(onLeaveToday).map(uid => getUserById(uid)?.name).filter(Boolean);

                impossibleSlots.push({
                    dateStr,
                    dow: getDayOfWeekName(dateStr),
                    shiftName: shift.name,
                    shiftTime: shift.time,
                    reqCount,
                    assignedCount: assignedForShift.length,
                    leaveNames,
                    blockedBy52h
                });
            }
        });

        userIds.forEach(uid => { if (assignedToday.has(uid)) stats[uid].consecutiveDays++; else stats[uid].consecutiveDays = 0; });
    });

    db.hasUnpublishedChanges = true;
    saveData();
    if (!silent) {
        state.currentWeekIndex = weekIndex;
        state.viewMode = 'week';
        renderApp();
        if (impossibleSlots.length > 0) {
            openScheduleImpossibleAlertModal(impossibleSlots);
        } else {
            const f = targetWeek[0], l = targetWeek[6];
            showToast(`${weekIndex + 1}주차(${f.month}/${f.day}~${l.month}/${l.day}) 주간 자동 가배정이 완료되었습니다!`, 'success');
        }
    }
}

function calculateFairnessScore(userStat, shift, dateStr, seedOffset) {
    const totalWorkWeight = userStat.totalWorked * 10;
    const shiftSpecificWeight = (userStat.shiftCounts[shift.id] || 0) * 14;
    const otWeight = getShiftOtHoursForDate(shift, dateStr) > 0 ? (userStat.totalOt * 8) : 0;
    let fatiguePenalty = 0;
    if (userStat.consecutiveDays >= 5) fatiguePenalty = 120;
    else if (userStat.consecutiveDays === 4) fatiguePenalty = 55;
    else if (userStat.consecutiveDays === 3) fatiguePenalty = 18;
    return totalWorkWeight + shiftSpecificWeight + otWeight + fatiguePenalty + ((seedOffset % 5) * 0.1);
}

function openScheduleImpossibleAlertModal(impossibleSlots) {
    let listHtml = impossibleSlots.map(item => `
        <div class="p-3 rounded-2xl bg-rose-50 border border-rose-200 space-y-1">
            <div class="flex items-center justify-between">
                <span class="font-extrabold text-xs text-rose-800">${item.dateStr} (${item.dow}) · ${item.shiftName}</span>
                <span class="text-[11px] font-bold px-2 py-0.5 rounded-full bg-rose-600 text-white">필수 ${item.reqCount}명 중 ${item.assignedCount}명 배정됨</span>
            </div>
            <div class="text-[11px] text-slate-600 space-y-0.5 pt-1">
                ${item.leaveNames.length > 0 ? `<div>• <b>승인 휴가자 제외</b>: ${item.leaveNames.length}명 (${item.leaveNames.slice(0, 5).join(', ')}${item.leaveNames.length > 5 ? ' 외' : ''})</div>` : ''}
                ${item.blockedBy52h.length > 0 ? `<div class="text-rose-700 font-semibold">• <b>주 52시간 초과 방지로 제외됨</b>: ${item.blockedBy52h.slice(0, 5).join(', ')}${item.blockedBy52h.length > 5 ? ` 외 ${item.blockedBy52h.length - 5}명` : ''}</div>` : ''}
                ${item.leaveNames.length === 0 && item.blockedBy52h.length === 0 ? `<div>• 가용 인원 부족 (1일 1시프트 또는 파트타임 고정시간 제약)</div>` : ''}
            </div>
        </div>
    `).join('');

    let html = `
        <div class="space-y-4">
            <div class="bg-amber-50 border border-amber-300 rounded-2xl p-3.5 text-xs text-amber-950 leading-relaxed">
                <div class="font-extrabold text-sm text-rose-600 flex items-center gap-1.5 mb-1">
                    <i class="fa-solid fa-triangle-exclamation"></i> 주간 스케줄 조합 불가 구간 발생 (${impossibleSlots.length}건)
                </div>
                주말 선배정 시간 합산, 휴가자 제외 및 <b>주 52시간 상한 규칙</b>을 모두 준수할 때 아래 날짜의 필수 인원을 채울 수 없습니다.
            </div>
            <div class="space-y-2 max-h-[45vh] overflow-y-auto pr-1">${listHtml}</div>
            <button onclick="closeModal()" class="w-full py-3.5 rounded-2xl bg-slate-900 text-white font-bold text-xs">확인 및 수동 조정하기</button>
        </div>
    `;
    openModal('🚨 주간 스케줄 조합 불가 안내', '주 52시간 제한 및 휴가자 제외로 인해 미배정된 시프트가 있습니다.', html);
}

/**
 * ==========================================
 * 3. 관리자 전용: [1단계: 주간별 주말/공휴일 근무자 선정] 모달
 * ==========================================
 */
function openWeekendPreAssignModal(targetWeekIdx = state.currentWeekIndex) {
    const year = state.currentYear, month = state.currentMonth;
    const weeks = getMonthCalendarWeeks(year, month);
    if (targetWeekIdx >= weeks.length) targetWeekIdx = 0;
    const currentWeek = weeks[targetWeekIdx];

    const holidayDates = currentWeek.filter(cell => isWeekendOrHoliday(cell.dateStr)).map(cell => ({
        ...cell,
        dow: getDayOfWeekName(cell.dateStr),
        label: getHolidayBadgeLabel(cell.dateStr)
    }));

    // 모달 내 주차 선택 버튼도 스크롤 없이 한눈에 다 보이도록 그리드로 배치
    let weekTabsHtml = weeks.map((w, idx) => {
        const f = w[0], l = w[6];
        const active = idx === targetWeekIdx;
        return `<button type="button" onclick="openWeekendPreAssignModal(${idx})" class="py-1.5 px-2 rounded-xl text-[11px] font-bold border transition ${active ? 'bg-rose-600 text-white border-rose-600 shadow-sm' : 'bg-white text-slate-600 border-slate-200'}">${idx + 1}주차 (${f.month}/${f.day}~${l.month}/${l.day})</button>`;
    }).join('');

    let cardsHtml = holidayDates.map(h => {
        const daySched = db.schedules[h.dateStr] || {};
        const approvedLeaves = new Set(db.leaveRequests.filter(lr => lr.date === h.dateStr && lr.status === 'approved').map(lr => lr.userId));
        const unavailUsers = (db.holidayUnavailables || []).filter(item => item.date === h.dateStr);

        let shiftRows = db.shifts.map(s => {
            const assignedIds = daySched[s.id] || [];
            const c = getShiftColor(s.colorId);
            const holOt = getShiftOtHoursForDate(s, h.dateStr);

            return `
            <div class="p-2.5 rounded-xl bg-slate-50 border border-slate-200 space-y-2">
                <div class="flex items-center justify-between">
                    <div>
                        <span style="background:${c.bg}; color:${c.text}; border:1px solid ${c.border}" class="text-[10px] font-bold px-2 py-0.5 rounded">${s.name}</span>
                        <span class="text-[11px] font-semibold text-slate-600 ml-1">${s.time}</span>
                    </div>
                    <span class="text-[10px] font-extrabold text-rose-600">배정 ${assignedIds.length}명 (휴일OT +${holOt}h)</span>
                </div>
                <div class="flex flex-wrap gap-1">
                    ${assignedIds.length === 0 ? '<span class="text-[11px] text-slate-400">배정된 인원 없음</span>' : assignedIds.map(uid => {
                        const u = getUserById(uid);
                        return u ? `<button type="button" onclick="toggleWeekendWorker('${h.dateStr}', '${s.id}', '${u.id}', ${targetWeekIdx})" class="px-2 py-0.5 rounded-lg bg-indigo-600 text-white text-[11px] font-bold flex items-center gap-1">${u.name} <i class="fa-solid fa-xmark text-[9px]"></i></button>` : '';
                    }).join('')}
                </div>
                <div class="flex gap-1.5 pt-1">
                    <select id="wk-sel-${h.dateStr}-${s.id}" class="flex-1 bg-white border border-slate-200 rounded-lg px-2 py-1 text-xs">
                        <option value="">+ 주말 근무자 선택 (${db.users.length}명 중)...</option>
                        ${db.users.map(u => {
                            if (assignedIds.includes(u.id)) return '';
                            if (!canUserWorkShift(u, s.id)) return '';
                            const isLv = approvedLeaves.has(u.id);
                            const isUnavail = isUserHolidayUnavailable(u.id, h.dateStr);
                            if (isLv || isUnavail) {
                                return `<option value="${u.id}" disabled>${u.name} (${u.role}) - [${isLv ? '휴가' : '근무불가 신청됨'}]</option>`;
                            }
                            return `<option value="${u.id}">${u.name} (${u.role})</option>`;
                        }).join('')}
                    </select>
                    <button type="button" onclick="addWeekendWorkerFromSelect('${h.dateStr}', '${s.id}', ${targetWeekIdx})" class="px-3 py-1 rounded-lg bg-slate-800 text-white text-xs font-bold">추가</button>
                </div>
            </div>`;
        }).join('');

        return `
        <div class="p-3.5 rounded-2xl border border-slate-200 bg-white space-y-2.5 shadow-sm">
            <div class="flex items-center justify-between border-b border-slate-100 pb-2">
                <div class="flex items-center gap-2">
                    <span class="font-extrabold text-sm text-rose-600">${h.month}월 ${h.day}일 (${h.dow})</span>
                    <span class="text-[10px] font-bold px-2 py-0.5 rounded-full bg-rose-100 text-rose-700">${h.label}</span>
                </div>
                ${unavailUsers.length > 0 ? `<span class="text-[10px] font-bold text-rose-600">🚫 불가신청 ${unavailUsers.length}명</span>` : ''}
            </div>
            <div class="space-y-2">${shiftRows}</div>
        </div>`;
    }).join('');

    let html = `
        <div class="space-y-3.5">
            <div class="grid grid-cols-3 gap-1.5">${weekTabsHtml}</div>
            <div class="bg-indigo-50 border border-indigo-200 rounded-2xl p-3 text-xs text-indigo-950 space-y-1">
                <div class="font-bold text-indigo-700">📌 1단계: ${targetWeekIdx + 1}주차 주말·공휴일 근무자 먼저 선정</div>
                <div>• 선정한 주말 스케줄은 <b>[2단계: ${targetWeekIdx + 1}주차 주간 자동배정]</b> 실행 시 그대로 보존되며 주 52시간 계산에 선반영됩니다.</div>
            </div>
            <div class="space-y-3 max-h-[48vh] overflow-y-auto pr-1">${cardsHtml}</div>
            <div class="grid grid-cols-2 gap-2 pt-2">
                <button onclick="clearWeekWeekendSchedules(${targetWeekIdx})" class="py-3 rounded-2xl bg-rose-50 text-rose-600 font-bold text-xs border border-rose-200">${targetWeekIdx + 1}주차 주말 비우기</button>
                <button onclick="closeModal(); openAutoScheduleConfirmModal(${targetWeekIdx});" class="py-3 rounded-2xl bg-indigo-600 text-white font-bold text-xs shadow-md">2단계: ${targetWeekIdx + 1}주차 자동배정 →</button>
            </div>
        </div>
    `;
    openModal(`${targetWeekIdx + 1}주차 주말·공휴일 근무자 선정`, '', html);
}

function addWeekendWorkerFromSelect(dateStr, shiftId, weekIdx) {
    const sel = document.getElementById(`wk-sel-${dateStr}-${shiftId}`);
    if (!sel || !sel.value) return;
    toggleWeekendWorker(dateStr, shiftId, sel.value, weekIdx);
}

function toggleWeekendWorker(dateStr, shiftId, userId, weekIdx) {
    if (!db.schedules[dateStr]) db.schedules[dateStr] = {};
    if (!db.schedules[dateStr][shiftId]) db.schedules[dateStr][shiftId] = [];

    const alreadyInThis = db.schedules[dateStr][shiftId].includes(userId);
    db.shifts.forEach(s => {
        if (db.schedules[dateStr][s.id]) {
            db.schedules[dateStr][s.id] = db.schedules[dateStr][s.id].filter(id => id !== userId);
        }
    });

    if (!alreadyInThis) {
        db.schedules[dateStr][shiftId].push(userId);
    }

    markScheduleDirty();
    openWeekendPreAssignModal(weekIdx);
    renderApp();
}

function clearWeekWeekendSchedules(weekIdx) {
    const weeks = getMonthCalendarWeeks(state.currentYear, state.currentMonth);
    const targetWeek = weeks[weekIdx] || [];
    targetWeek.forEach(cell => {
        if (isWeekendOrHoliday(cell.dateStr)) {
            db.schedules[cell.dateStr] = {};
            db.shifts.forEach(s => db.schedules[cell.dateStr][s.id] = []);
        }
    });
    markScheduleDirty();
    openWeekendPreAssignModal(weekIdx);
    renderApp();
    showToast(`${weekIdx + 1}주차 주말/공휴일 배정이 초기화되었습니다.`, 'info');
}

function handlePinLoginSubmit() {
    const target = document.getElementById('login-user-select').value;
    const pin = document.getElementById('login-pin-input').value;

    if (target === 'admin') {
        if (pin !== db.adminPin) return showToast('관리자 PIN 번호가 일치하지 않습니다.', 'error');
        const adminObj = { id: 'admin', name: '총괄 관리자', role: 'ADMIN', isAdmin: true };
        state.authSession = adminObj;
        state.currentUser = adminObj;
        state.activeTab = 'schedule';
        state.scheduleFilter = 'all';
        showToast('관리자 모드로 로그인되었습니다.', 'success');
        renderApp();
    } else {
        const user = getUserById(target);
        if (!user) return;
        if (pin !== user.pin) return showToast(`${user.name}님의 PIN 번호가 일치하지 않습니다.`, 'error');
        const workerObj = { ...user, isAdmin: false };
        state.authSession = workerObj;
        state.currentUser = workerObj;
        state.activeTab = 'schedule';
        state.scheduleFilter = 'my';
        showToast(`${user.name}님 환영합니다!`, 'success');
        renderApp();
    }

                <div class="bg-white/10 rounded-2xl py-2 px-1"><div class="text-[10px] text-indigo-100">잔여 연차</div><div class="text-sm font-bold mt-0.5">${myStats.remainingLeave}일</div></div>
            </div>

    ` : '';

    return `
    <div class="p-4 space-y-4">
        ${over52AlertBanner}

        <div class="bg-white rounded-2xl p-3 border shadow-sm space-y-2.5">
            <div class="flex justify-between items-center">
                <div class="flex gap-1 items-center">
                    <button onclick="changeMonth(-1)" class="w-8 h-8 rounded-xl bg-slate-100 flex justify-center items-center text-xs"><i class="fa-solid fa-chevron-left"></i></button>
                    <span class="font-bold text-sm px-2">${year}년 ${month}월</span>
                    <button onclick="changeMonth(1)" class="w-8 h-8 rounded-xl bg-slate-100 flex justify-center items-center text-xs"><i class="fa-solid fa-chevron-right"></i></button>
                </div>
                <div class="flex bg-slate-100 p-1 rounded-xl">
                    <button onclick="setViewMode('week')" class="px-3 py-1 rounded-lg text-xs font-bold transition ${state.viewMode === 'week' ? 'bg-indigo-600 text-white shadow-sm' : 'text-slate-600'}">주간(근무표)</button>
                    <button onclick="setViewMode('month')" class="px-3 py-1 rounded-lg text-xs font-bold transition ${state.viewMode === 'month' ? 'bg-indigo-600 text-white shadow-sm' : 'text-slate-600'}">월간(휴가·불가)</button>
                </div>
            </div>
            ${!isAdmin ? `
            <div class="flex items-center justify-between pt-2 border-t border-slate-100">
                <span class="text-[11px] text-slate-400">열람 범위 선택</span>
                <div class="flex bg-slate-100 p-0.5 rounded-xl">
                    <button onclick="setScheduleFilter('my')" class="px-2.5 py-1 rounded-lg text-[11px] font-bold ${state.scheduleFilter === 'my' ? 'bg-white text-indigo-600 shadow-sm' : 'text-slate-500'}">내 스케줄만</button>
                    <button onclick="setScheduleFilter('all')" class="px-2.5 py-1 rounded-lg text-[11px] font-bold ${state.scheduleFilter === 'all' ? 'bg-white text-indigo-600 shadow-sm' : 'text-slate-500'}">전체 보기</button>
                </div>
            </div>
            ` : ''}
        </div>
        ${state.viewMode === 'month' ? renderMonthGrid(year, month, weeks) : renderWeekDetailList(year, month, weeks, overUserMap)}
    </div>`;
}

function renderMonthGrid(year, month, weeks) {
    const isAdmin = isViewingAsAdmin();
    const filterMy = !isAdmin && state.scheduleFilter === 'my';
    const myId = state.currentUser.id;

    let weeksHtml = weeks.map(week => `
        <div class="grid grid-cols-7 divide-x">
            ${week.map((cell, dIdx) => {
                const { dateStr, day, isCurrentMonth } = cell;
                const isHol = isWeekendOrHoliday(dateStr);
                const isCustomHol = (db.holidays || []).includes(dateStr);

                let approvedLeaves = db.leaveRequests.filter(lr => lr.date === dateStr && lr.status === 'approved');
                let unavails = (db.holidayUnavailables || []).filter(item => item.date === dateStr);

                if (filterMy) {
                    approvedLeaves = approvedLeaves.filter(lr => lr.userId === myId);
                    unavails = unavails.filter(u => u.userId === myId);
                }

                let html = '';
                if (approvedLeaves.length > 0) {
                    approvedLeaves.slice(0, 3).forEach(lr => {
                        const u = getUserById(lr.userId);
                        if (u) html += `<div class="mb-0.5 px-1 py-0.2 rounded bg-rose-50 text-rose-700 border border-rose-200 text-[9px] font-bold truncate">🌴휴·${u.name}</div>`;
                    });
                    if (approvedLeaves.length > 3) {
                        html += `<div class="mb-0.5 px-1 py-0.2 rounded bg-rose-100 text-rose-800 text-[8px] font-extrabold text-center">휴가 외 +${approvedLeaves.length - 3}명</div>`;
                    }
                }

                if (unavails.length > 0) {
                    unavails.slice(0, 3).forEach(item => {
                        const u = getUserById(item.userId);
                        if (u) html += `<div class="mb-0.5 px-1 py-0.2 rounded bg-slate-200/80 text-slate-700 border border-slate-300 text-[9px] font-bold truncate">🚫불가·${u.name}</div>`;
                    });
                    if (unavails.length > 3) {
                        html += `<div class="mb-0.5 px-1 py-0.2 rounded bg-slate-300 text-slate-800 text-[8px] font-extrabold text-center">불가 외 +${unavails.length - 3}명</div>`;
                    }
                }

                const isToday = (dateStr === formatDate(CURRENT_YEAR, CURRENT_MONTH, todayObj.getDate()));
                const dayColor = isToday ? 'w-5 h-5 rounded-full bg-indigo-600 text-white flex justify-center items-center' : (!isCurrentMonth ? 'text-slate-300 font-semibold' : ((dIdx===0 || isCustomHol) ? 'text-rose-500 font-extrabold' : (dIdx===6 ? 'text-blue-500 font-extrabold' : 'text-slate-700')));
                return `
                <div onclick="openDayScheduleModal('${dateStr}')" class="cal-cell p-1 flex flex-col cursor-pointer ${!isCurrentMonth ? 'bg-slate-50/60 opacity-65' : (isHol ? 'bg-rose-50/20' : '')} hover:bg-indigo-50/40">
                    <div class="flex items-center justify-between">

                    <div class="mt-0.5 flex-1 flex flex-col overflow-hidden">${html}</div>

    return `

            <button onclick="setViewMode('week')" class="text-indigo-600 font-bold underline">전 직원 근무표(주간)→</button>
